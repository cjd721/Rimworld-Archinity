<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Working Surface</title>
<!-- The working surface (#199). Served by tools/surface_server.py; the state is docs/data/working-surface.json.
     No external resources. The Surface module below is the pure state logic; everything after it is the page. -->
<style>
:root{
  --bg:#F5F5F3; --surface:#FFFFFF; --sunk:#F0F0ED; --hover:#F7F7F5;
  --line:#E4E4E0; --line-2:#D6D6D1;
  --ink:#1D2126; --ink-2:#464C55; --ink-3:#6B717A; --ink-4:#9A9FA6;
  --accent:#4F5BD5; --accent-2:#3E48B8; --accent-soft:#EEF0FC; --accent-line:#C9CEF5;
  --ok:#1E7F55; --ok-soft:#E6F4EC; --bad:#BF3B34; --bad-soft:#FBECEA; --warn:#A8670E; --warn-soft:#FBF1E0;
  --dig:#2C6FB7; --dig-soft:#E8F1FB;
  --agent:#0E7C86; --agent-soft:#E2F3F4; --agent-line:#9FD3D8;
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --display:"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,monospace;
  --r:10px; --r-sm:7px;
  --sh-1:0 1px 2px rgba(20,24,30,.05),0 1px 1px rgba(20,24,30,.03);
  --sh-2:0 2px 6px rgba(20,24,30,.06),0 8px 24px rgba(20,24,30,.06);
  --sh-3:0 12px 40px rgba(20,24,30,.16),0 2px 8px rgba(20,24,30,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;resize:vertical;line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.88em}
kbd{font:600 11px/1 var(--sans);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:2px 5px;background:#fff;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink);box-shadow:var(--sh-1);transition:background .12s,border-color .12s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--ink-4)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px;flex:none}
.iconbtn{display:inline-grid;place-items:center;width:26px;height:26px;border:none;background:transparent;border-radius:6px;color:var(--ink-3);padding:0}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}
.link{border:none;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}

/* app frame */
.app{display:grid;grid-template-rows:56px auto minmax(0,1fr);height:100vh}
.app>.top{grid-row:1} .app>.viewbanner{grid-row:2} .app>.body{grid-row:3}
.top{display:flex;align-items:center;gap:24px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:650;font-size:15px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--ink-3);font-size:13px}
.tabs{display:flex;gap:2px;height:100%}
.tab{position:relative;border:none;background:none;padding:0 12px;font-size:13.5px;font-weight:500;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.count{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--sunk);color:var(--ink-2);font-variant-numeric:tabular-nums}
.tab.on .count{background:var(--accent-soft);color:var(--accent)}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px}
.savepill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);padding:4px 10px;border-radius:99px;background:var(--sunk)}
.savepill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.savepill.dirty .dot,.savepill.saving .dot{background:var(--warn)}
.savepill.bad{background:var(--bad-soft);color:var(--bad)} .savepill.bad .dot{background:var(--bad)}
.savepill.ro{background:var(--agent-soft);color:var(--agent)} .savepill.ro .dot{background:var(--agent)}
/* Mine | Agent's: the agent's view is read-only and tinted so the two cannot be confused */
#viewtog{margin-left:auto} #viewtog+.topright{margin-left:0}
.seg.view button.on.agent{background:var(--agent)}
.viewbanner{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--agent-soft);color:#0A5A61;border-bottom:1px solid var(--agent-line);font-size:13px;font-weight:600}
.viewbanner:empty{display:none}
.viewbanner .small{font-weight:400;color:#2F6F75;font-family:var(--mono);font-size:11.5px}
body.ro .top{box-shadow:inset 0 4px 0 var(--agent)}

.body{display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
.body.with-panel{grid-template-columns:minmax(0,1fr) 540px}
.body.with-panel.wide{grid-template-columns:minmax(0,1fr) min(1100px,70vw)}
.main{min-height:0;overflow:auto;position:relative}
.panel{min-height:0;overflow:auto;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(20,24,30,.04)}

/* shared pieces */
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.id{font-family:var(--mono);font-size:11px;color:var(--ink-4);font-weight:400;letter-spacing:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;line-height:18px;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;cursor:default}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.dig{background:var(--dig-soft);color:var(--dig)}
.chip.solid{background:var(--accent);color:#fff}
.chip.out{background:#fff;border:1px solid var(--line-2);line-height:16px}
.chip.click{cursor:pointer} .chip.click:hover{filter:brightness(.96)}
.chip .sw{width:8px;height:8px;border-radius:50%;flex:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.empty{color:var(--ink-3);font-size:13.5px;padding:16px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--hover)}
.empty b{color:var(--ink-2)}

/* ============ tree ============ */
.treebar{position:sticky;top:0;left:0;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 20px;background:rgba(245,245,243,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}
.canvas{padding:28px 40px 120px}
.org{width:max-content;min-width:100%}
.org ul{display:flex;justify-content:center;margin:0;padding:24px 0 0;position:relative;list-style:none}
.org li{position:relative;display:flex;flex-direction:column;align-items:center;padding:24px 10px 0}
.org li::before,.org li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:24px;border-top:1.5px solid var(--line-2)}
.org li::after{right:auto;left:50%;border-left:1.5px solid var(--line-2)}
.org li:only-child::before,.org li:only-child::after{display:none}
.org li:only-child{padding-top:0}
.org li:first-child::before,.org li:last-child::after{border:0 none}
.org li:last-child::before{border-right:1.5px solid var(--line-2);border-radius:0 8px 0 0}
.org li:first-child::after{border-radius:8px 0 0 0}
.org ul ul::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:1.5px solid var(--line-2)}
.org>ul{padding-top:0}
.grp{display:flex;flex-direction:column;align-items:stretch;width:272px}

.nnode{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);padding:12px 12px 10px 14px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.nnode::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:4px;border-radius:var(--r) var(--r) 0 0;background:var(--c,var(--line-2))}
.nnode:hover{box-shadow:var(--sh-2)}
.nnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-2)}
.nnode.root{width:340px;align-self:center;padding:16px 16px 12px}
.nnode.root::before{background:linear-gradient(90deg,var(--ink-2),var(--ink-4))}
.nhead{display:flex;gap:6px;align-items:flex-start}
.ntext{flex:1;font-weight:600;font-size:14.5px;line-height:1.35;letter-spacing:-.005em;overflow-wrap:anywhere}
.root .ntext{font-family:var(--display);font-size:16.5px}
.ntext.placeholder{color:var(--ink-3);font-weight:500}
.ndesc{margin-top:4px;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.nfoot{display:flex;align-items:center;gap:6px;margin-top:9px}
.nfoot .spacer{flex:1}
.nnode .hov{opacity:0;transition:opacity .12s}
.nnode:hover .hov,.nnode.sel .hov,.cnode:hover .hov,.cnode.sel .hov{opacity:1}
.addbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600}
.addbtn:hover{background:#E3E6FA}
.addbtn svg{width:13px;height:13px}
.chev{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;margin:-1px 0 0 -4px;border:none;background:transparent;border-radius:5px;color:var(--ink-3);padding:0}
.chev:hover{background:var(--sunk);color:var(--ink)}
.chev svg{width:14px;height:14px;transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev.none{display:none}
.nnode input.inline{width:100%;font-weight:600;padding:4px 8px}

.capstack{position:relative;margin:0 0 0 14px;padding:8px 0 0 14px;display:flex;flex-direction:column;gap:8px}
.capstack::before{content:"";position:absolute;left:0;top:0;bottom:22px;border-left:1.5px solid var(--line-2)}
.cnode{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-1);padding:9px 10px 8px 14px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.cnode::before{content:"";position:absolute;left:-15px;top:20px;width:14px;border-top:1.5px solid var(--line-2)}
.cnode::after{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:4px;border-radius:var(--r-sm) 0 0 var(--r-sm);background:var(--stripe,var(--line-2))}
.cnode:hover{box-shadow:var(--sh-2)}
.cnode.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--sh-2)}
.ctext{flex:1;font-size:13px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;align-items:center;gap:6px;margin:3px 0 0 22px;font-size:11.5px;color:var(--ink-3);min-width:0}
.cmeta .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cmeta .id{white-space:nowrap}
.cbadges{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0 22px}
.cbadges .chip{font-size:11.5px;line-height:16px;padding:1px 7px;max-width:100%}
.cbadges .chip .el{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.nmeta .chip{font-size:11.5px;line-height:16px;padding:1px 7px}
.rlist{margin:8px 0 0 22px;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:6px}
.rnode{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:baseline;padding:4px 6px;border-radius:5px;font-size:12px;cursor:pointer}
.rnode:hover{background:var(--hover)}
.rnode.sel{background:var(--accent-soft)}
.rnode .rl{font-weight:650;color:var(--ink-2);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rnode code,.rcard code,.ptitle code,.item code,.rtable code,.ctext code,.qtitle code{background:var(--sunk);border-radius:4px;padding:0 4px;font-size:.86em}
.rnode .rs{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rnode .rw{font-size:11px;color:var(--ink-3);white-space:nowrap}
.rnode.struck .rs,.rnode.struck .rl{color:var(--ink-4);text-decoration:line-through}
.ghostcard{width:100%;border:1.5px dashed var(--accent-line);background:rgba(238,240,252,.5);color:var(--accent);border-radius:var(--r);padding:16px;font-weight:600;font-size:13.5px}
.ghostcard:hover{background:var(--accent-soft)}
.newcard{background:#fff;border:1.5px solid var(--accent);border-radius:var(--r);padding:10px;box-shadow:0 0 0 3px var(--accent-soft)}
.newcard input{width:100%}
.newcard .small{margin-top:6px}
@keyframes flash{0%,100%{box-shadow:var(--sh-1)}30%{box-shadow:0 0 0 5px rgba(79,91,213,.35),var(--sh-2)}}
.flash{animation:flash 1.4s ease 2}

/* ============ panel ============ */
.ph{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:6px}
.pb{padding:20px 24px 60px}
.ptitle{font-family:var(--display);font-size:21px;line-height:1.3;font-weight:650;letter-spacing:-.015em;margin:6px 0 10px;overflow-wrap:anywhere}
.ptitle.edit{cursor:text;border-radius:6px;margin-left:-6px;padding:0 6px}
.ptitle.edit:hover{background:var(--hover)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.crumbs .link{color:var(--ink-2)}
.sec{margin-top:26px}
.sec>h3{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.sec>h3 .spacer{flex:1}
.sec>h3 .btn{text-transform:none;letter-spacing:0}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.kv>dt{color:var(--ink-3);font-size:12.5px;padding-top:1px}
.kv>dd{margin:0}
.prov{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.prov.unstated{color:var(--warn)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.box+.box{margin-top:8px}
.placement{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
.placement+.placement{margin-top:6px}
.placement .sw{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.placement .grow{flex:1;min-width:0}
details.framing{border:1px solid var(--line);border-radius:var(--r);padding:0 14px}
details.framing>summary{cursor:pointer;padding:11px 0;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
details.framing>summary::-webkit-details-marker{display:none}
details.framing>summary svg{width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
details.framing[open]>summary svg{transform:rotate(90deg)}
details.framing .inner{padding:0 0 14px}
.frlist{margin:4px 0 12px;padding-left:18px;font-size:13.5px}
.frlist li{margin:3px 0}
.frhead{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:10px}
.frhead.can{color:var(--ok)} .frhead.cannot{color:var(--bad)}

/* route comparison */
.cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);margin:0 -4px}
.cmp{display:grid;grid-auto-flow:column;grid-auto-columns:204px;grid-template-rows:auto;gap:0;padding:8px;gap:8px;width:max-content}
.allroutes{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:10px;font-size:13px;display:grid;gap:4px}
.allroutes .lab{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
.allroutes .prov{display:inline;margin-left:6px}
.rcard{display:grid;grid-template-rows:subgrid;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-1);font-size:12.5px;overflow:hidden}
.rcard>div{padding:7px 11px;border-top:1px solid var(--line)}
.rcard>div:first-child{border-top:none}
.rcard .rh{display:flex;flex-direction:column;gap:5px;cursor:pointer;background:var(--hover)}
.rcard .rh:hover{background:var(--accent-soft)}
.rcard .rh b{font-size:13.5px}
.rcard .lab{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);display:block;margin-bottom:2px}
.rcard .acts{display:flex;gap:4px;flex-wrap:wrap;align-self:end}
.rcard.struck{background:#FAFAF8;opacity:.8}
.rcard.struck .rh b{text-decoration:line-through;color:var(--ink-3)}
.rcard.struck .collapsed{color:var(--ink-3)}
.rcard.selected{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok-soft)}
.pnrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm)}
.pnrow+.pnrow{margin-top:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--line-2)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.w{background:var(--bad)} .seg button.on.d{background:var(--dig)}
.seg button.on.sug{background:var(--ok)} .seg button.on.rej{background:var(--bad)} .seg button.on.opn{background:var(--warn)}
.rtick{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;font-size:13px}
.rtick:hover{background:var(--hover)}
.rtick input{margin-top:3px}

/* markdown reader */
.spec{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.spec+.spec{margin-top:8px}
.spech{width:100%;display:flex;align-items:center;gap:10px;border:none;background:var(--hover);padding:10px 14px;text-align:left}
.spech:hover{background:var(--accent-soft)}
.spech svg{width:16px;height:16px;color:var(--accent);flex:none}
.spech .t{flex:1;font-weight:600;font-size:13.5px}
.spech .p{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.md{padding:6px 18px 14px;font-size:13.5px;line-height:1.6;color:var(--ink);border-top:1px solid var(--line);max-height:640px;overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere}
.md.full{max-height:none;border-top:none;padding:0}
.md p{margin:8px 0}
.md .mh{font-family:var(--display);font-weight:650;margin:16px 0 6px;line-height:1.3;letter-spacing:-.01em}
.md .mh1{font-size:19px} .md .mh2{font-size:17px} .md .mh3{font-size:15px} .md .mh4,.md .mh5,.md .mh6{font-size:14px}
.md>.mh:first-child{margin-top:10px}
.md ul,.md ol{padding-left:22px;margin:6px 0}
.md li{margin:3px 0}
.md code{background:var(--sunk);border-radius:4px;padding:1px 5px;font-size:12px}

<body>
<div class="app">
  <header class="top">
    <div class="brand">Archinity <small>Working surface</small></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="viewtog"></div>
    <div class="topright" id="topright"></div>
  </header>
  <div class="viewbanner" id="viewbanner"></div>
  <div class="body" id="body">
    <main class="main" id="main"><div class="page"><p class="muted">Loading the inventory and the state file…</p></div></main>
    <aside class="panel" id="panel" hidden></aside>
  </div>
</div>
<div id="pop"></div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script>
/* ================= Surface: the pure state module (no DOM, no I/O). ================= */
const Surface = (() => {
  const SCHEMA = "archinity.working-surface/1";
  const SECTIONS = ["needs", "sessions", "tags", "no_owner", "route_global", "route_need", "capability_decision", "notes"];
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const uniq = (a) => [...new Set(a)];
  const TICKET = /^#\d+$/;
  const cut = (t, n) => { t = String(t || ""); return t.length > n ? t.slice(0, n - 1) + "…" : t; };

  function indexInventory(inv) {
    const routesByCap = new Map();
    for (const r of inv.routes) { if (!routesByCap.has(r.capability)) routesByCap.set(r.capability, []); routesByCap.get(r.capability).push(r); }
    return { inv, cards: new Map(inv.cards.map(c => [c.id, c])), caps: new Map(inv.capabilities.map(c => [c.id, c])),
             routes: new Map(inv.routes.map(r => [r.id, r])), routesByCap };
  }
  function empty(ix) {
    return { schema: SCHEMA, inventory_commit: ix.inv.source_commit, needs: [], sessions: [], tags: [], no_owner: [],
             route_global: [], route_need: [], capability_decision: [], notes: [], followups: [] };
  }

  /* ---- tree ---- */
  const need = (s, id) => s.needs.find(n => n.id === id) || null;
  const root = (s) => s.needs.find(n => n.parent === null) || null;
  const children = (s, id) => s.needs.filter(n => n.parent === id).sort((a, b) => a.order - b.order || a.id.localeCompare(b.id));
  function ancestors(s, id) {
    const out = []; let n = need(s, id); const seen = new Set([id]);
    while (n && n.parent !== null && !seen.has(n.parent)) { seen.add(n.parent); out.push(n.parent); n = need(s, n.parent); }
    return out;
  }
  function subtree(s, id) { const out = [id]; for (let i = 0; i < out.length; i++) for (const c of children(s, out[i])) out.push(c.id); return out; }
  function sessionOf(s, id) { for (const x of [id, ...ancestors(s, id)]) if (s.sessions.includes(x)) return x; return null; }

  /* ---- capability reads ---- */
  const tagsOf = (s, cap) => s.tags.filter(t => t.capability === cap && need(s, t.need));
  const tagsAt = (s, needId) => s.tags.filter(t => t.need === needId);
  const noOwner = (s, cap) => s.no_owner.find(x => x.capability === cap) || null;
  const globalOf = (s, rid) => s.route_global.find(x => x.route === rid) || null;
  const isStruck = (s, rid) => (globalOf(s, rid) || {}).state === "struck";
  const decisionOf = (s, cap) => s.capability_decision.find(d => d.capability === cap) || null;
  const routeNeedOf = (s, rid, nid) => s.route_need.find(x => x.route === rid && x.need === nid) || null;
  const noteOf = (s, target) => (s.notes.find(n => n.target === target) || {}).text || "";
  const surviving = (s, ix, cap) => (ix.routesByCap.get(cap) || []).filter(r => !isStruck(s, r.id));
  const followupsOf = (s, type, target) => (s.followups || []).filter(f => f.target_type === type && f.target === target);

  /** Owned / shared, read off the session partition — never off raw tags. */
  function ownership(s, cap) {
    const tags = tagsOf(s, cap);
    if (!tags.length) return { status: noOwner(s, cap) ? "no_owner" : "untagged", sessions: [], unpartitioned: [] };
    const sessions = [], unpartitioned = [];
    for (const t of tags) {
      const ss = sessionOf(s, t.need);
      if (ss === null) { if (!unpartitioned.includes(t.need)) unpartitioned.push(t.need); }
      else if (!sessions.includes(ss)) sessions.push(ss);
    }
    const status = sessions.length > 1 ? "shared" : sessions.length === 1 ? "owned" : "unpartitioned";
    return { status, sessions, unpartitioned };
  }

  /** Two routes compose if the card says so (composes_with, either direction), or they sit in different groups of one row. */
  function composes(ix, a, b) {
    if (a === b) return true;
    const ra = ix.routes.get(a), rb = ix.routes.get(b);
    if (!ra || !rb) return false;
    if ((ra.composes_with || []).includes(b) || (rb.composes_with || []).includes(a)) return true;
    return ra.capability === rb.capability && !!ra.group && !!rb.group && ra.group !== rb.group;
  }
  function allCompose(ix, ids) { for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) if (!composes(ix, ids[i], ids[j])) return false; return true; }

  function sessionView(s, ix, cap) {
    const own = ownership(s, cap);
    const rids = new Set((ix.routesByCap.get(cap) || []).map(r => r.id));
    const keys = [...own.sessions, ...(own.unpartitioned.length ? [null] : [])];
    return keys.map(k => {
      const needs = uniq(tagsOf(s, cap).map(t => t.need).filter(n => sessionOf(s, n) === k));
      const entries = s.route_need.filter(x => needs.includes(x.need) && rids.has(x.route));
      const by = (st) => uniq(entries.filter(e => e.state === st).map(e => e.route));
      return { session: k, needs, entries, suggested: by("suggested"), rejected: by("rejected"), open: by("open") };
    });
  }

  function conflicts(s, ix) {
    const out = [];
    for (const c of ix.inv.capabilities) {
      const own = ownership(s, c.id);
      if (own.status !== "shared") continue;
      const sv = sessionView(s, ix, c.id).filter(x => x.session !== null);
      const withSug = sv.filter(x => x.suggested.length);
      const dec = decisionOf(s, c.id);
      const allSug = uniq(withSug.flatMap(x => x.suggested));
      const crossRejected = allSug.filter(r => sv.some(x => x.rejected.includes(r)));
      let kind;
      if (dec && dec.state === "selected") kind = "decided";
      else if (crossRejected.length) kind = "conflict";
      else if (withSug.length < 2) kind = "waiting";
      else {
        const sets = withSug.map(x => [...x.suggested].sort().join("|"));
        kind = sets.every(x => x === sets[0]) ? "agree" : allCompose(ix, allSug) ? "compose" : "conflict";
      }
      out.push({ capability: c.id, kind, sessions: sv, crossRejected, struckSuggestions: allSug.filter(r => isStruck(s, r)) });
    }
    return out;
  }

  function orphans(s, ix) {
    const tagged = new Set(s.tags.filter(t => need(s, t.need)).map(t => t.capability));
    const caps = ix.inv.capabilities.filter(c => !tagged.has(c.id) && !noOwner(s, c.id)).map(c => c.id);
    const noOwnerCaps = s.no_owner.map(x => x.capability);
    const needs = s.needs.filter(n => n.parent !== null && !subtree(s, n.id).some(id => tagsAt(s, id).length)).map(n => n.id);
    return { caps, noOwnerCaps, needs };
  }

  /* ---- writes: apply(state, ix, action) -> {state, changed[], error?, message?, warning?} ---- */
  const fail = (error) => ({ error });
  function nextNeedId(s) { const m = s.needs.reduce((a, n) => Math.max(a, parseInt(String(n.id).replace(/\D/g, ""), 10) || 0), 0); return "N-" + String(m + 1).padStart(3, "0"); }
  function nextFollowupId(s) { const m = (s.followups || []).reduce((a, f) => Math.max(a, parseInt(String(f.id).replace(/\D/g, ""), 10) || 0), 0); return "F-" + String(m + 1).padStart(3, "0"); }
  function renumber(s, parent) { children(s, parent).forEach((n, i) => { n.order = i; }); }
  function setNote(list, target, text) { const i = list.findIndex(n => n.target === target); if (!text) { if (i >= 0) list.splice(i, 1); } else if (i >= 0) list[i].text = text; else list.push({ target, text }); }

  function apply(s0, ix, a) {
    const s = clone(s0); if (!s.followups) s.followups = [];
    const changed = new Set(); let message = null, warning = null;
    const need_ = (id) => need(s, id);
    const nq = (id) => `“${cut((need_(id) || {}).statement || id, 48)}”`;
    const cq = (id) => `“${cut((ix.caps.get(id) || {}).text || id, 48)}”`;
    const rq = (id) => { const r = ix.routes.get(id); return r ? `route ${r.label || id}` : id; };
    switch (a.type) {
      case "createRoot": {
        if (s.needs.length) return fail("The tree already has a root.");
        s.needs.push({ id: "N-001", parent: null, statement: a.statement || "", description: "", order: 0 });
        changed.add("needs"); break;
      }
      case "addNeed": {
        if (!need_(a.parent)) return fail("Pick a parent need first.");
        const st = (a.statement || "").trim(); if (!st) return fail("Write the need before adding it.");
        const id = nextNeedId(s);
        s.needs.push({ id, parent: a.parent, statement: st, description: (a.description || "").trim(), order: children(s, a.parent).length });
        changed.add("needs"); message = `Added ${nq(id)}.`; break;
      }
      case "renameNeed": {
        const n = need_(a.id); if (!n) return fail("That need no longer exists.");
        const st = (a.statement || "").trim(); if (!st) return fail("A need cannot be blank.");
        n.statement = st; changed.add("needs"); break;
      }

const stateText = () => JSON.stringify(Surface.exportObject(mineState(), new Date().toISOString()), null, 2) + "\n";
function scheduleSave() { if (RO()) return; SAVE = "dirty"; renderTop(); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
async function saveNow() {
  if (!mineState()) return;
  if (saving) { again = true; return; }
  saving = true; SAVE = "saving"; renderTop();
  try {
    const r = await fetch("/api/state", { method: "PUT", headers: { "Content-Type": "application/json", ...(ETAG ? { "If-Match": ETAG } : {}) }, body: stateText() });
    if (r.status === 409) { SAVE = "conflict"; again = false; toast("The state file changed on disk after this page loaded it. Nothing was saved. Reload to pick up the file.", "err"); }
    else if (!r.ok) { SAVE = "error"; toast("Save failed: " + await r.text(), "err"); }
    else { ETAG = r.headers.get("ETag"); SAVE = again ? "dirty" : "saved"; }
  } catch (e) { SAVE = "error"; toast("Save failed: the server is not answering. Is surface_server.py running?", "err"); }
  finally { saving = false; renderTop(); if (again && SAVE !== "conflict") { again = false; saveNow(); } }
}
window.addEventListener("beforeunload", (e) => { if (SAVE === "dirty" || SAVE === "saving" || SAVE === "error") { e.preventDefault(); e.returnValue = ""; } });

function dispatch(action, quiet) {
  if (RO()) { toast("The agent's assessment is read-only. Switch to Mine to edit.", "warn"); return false; }
  const r = Surface.apply(S || Surface.empty(IX), IX, action);
  if (r.error) { toast(r.error, "err"); return false; }
  if (S) { UNDO.push(S); if (UNDO.length > 80) UNDO.shift(); }
  S = r.state;
  if (r.message && !quiet) toast(r.message, "", true);
  if (r.warning) toast(r.warning, "warn");
  scheduleSave(); render();
  return true;
}
function undo() {
  if (RO()) return;
  if (!UNDO.length) { toast("Nothing to undo."); return; }
  S = UNDO.pop(); closePop(); scheduleSave(); render(); toast("Undone.");
}

async function load() {
  try {
    const ri = await fetch("/api/inventory"); if (!ri.ok) throw new Error("inventory: HTTP " + ri.status);
    PATHS.inventory = ri.headers.get("X-Inventory-Path") || "";
    IX = Surface.indexInventory(await ri.json());
    try { const rg = await fetch("/api/glosses"); if (rg.ok) { const g = await rg.json(); GL = { capabilities: g.capabilities || {}, routes: g.routes || {} }; } } catch (e) {}
    const rs = await fetch("/api/state"); PATHS.state = rs.headers.get("X-State-Path") || "";
    if (rs.status === 404) { S = null; }
    else if (!rs.ok) throw new Error("state: HTTP " + rs.status);
    else {
      ETAG = rs.headers.get("ETag");
      const r = Surface.importObject(IX, await rs.json());
      if (r.errors.length) { LOAD = "failed"; $("main").innerHTML = `<div class="page"><h1>The state file does not load</h1><ul>${r.errors.map(e => `<li>${esc(e)}</li>`).join("")}</ul><p class="lede">Nothing was changed. Fix the file, then reload.</p></div>`; renderTop(); return; }
      S = r.state; LOAD_WARNINGS = r.warnings;
    }
    LOAD = "ready"; UI._railReveal = true;
    if (!S || !S.needs.length) { S = Surface.apply(S || Surface.empty(IX), IX, { type: "createRoot", statement: "" }).state; scheduleSave(); }
    const rt = Surface.root(S);
    if (!LS.get("open")) { UI.open.add("n|" + rt.id); S.needs.forEach(n => UI.open.add("n|" + n.id)); }
    UI.open.add("n|" + rt.id);
    render();
    if (LS.get("view") === "agent") setView("agent");
  } catch (e) {
    LOAD = "failed"; renderTop();
    $("main").innerHTML = `<div class="page"><h1>Cannot reach the surface server</h1><p class="lede">Start it from the repo root with <code>python tools/surface_server.py</code> (or double-click <code>tools/surface.cmd</code>), then reload. (${esc(e.message)})</p></div>`;
  }
}

/* ---------- the two views ---------- */
async function flushSave() {
  clearTimeout(saveTimer);
  if (SAVE === "dirty") await saveNow();
  while (saving) await new Promise(r => setTimeout(r, 25));
}
async function loadAgent() {
  try {
    const r = await fetch("/api/agent-state", { cache: "no-store" }); PATHS.agent = r.headers.get("X-State-Path") || PATHS.agent;
    if (r.status === 404) return { status: "missing" };
    if (!r.ok) return { status: "error", errors: ["HTTP " + r.status] };

}

const viewWarnings = () => RO() ? (AGENT.warnings || []) : LOAD_WARNINGS;

/* ---------- derived reads (cached per render) ---------- */
let C = null;
function cache() {
  if (C) return C;
  const rt = Surface.root(S);
  const top = rt ? Surface.children(S, rt.id) : [];
  const branchIdx = new Map(top.map((n, i) => [n.id, i]));
  const branchOf = new Map();
  for (const n of S.needs) {
    if (n.parent === null) { branchOf.set(n.id, null); continue; }
    const chain = [n.id, ...Surface.ancestors(S, n.id)];
    branchOf.set(n.id, chain.find(x => branchIdx.has(x)) || null);
  }
  C = { rt, top, branchIdx, branchOf, stats: new Map() };
  return C;
}
const colorOfBranch = (b) => b == null ? "#9A9FA6" : BRANCH[cache().branchIdx.get(b) % BRANCH.length];
const colorOfNeed = (id) => colorOfBranch(cache().branchOf.get(id));
const placementsOf = (cap) => Surface.tagsOf(S, cap).map(t => t.need);
function capColors(cap) { return [...new Set(placementsOf(cap).map(colorOfNeed))]; }
function stripe(colors) {
  if (!colors.length) return "var(--line-2)";
  if (colors.length === 1) return colors[0];
  const step = 100 / colors.length;
  return `linear-gradient(to bottom, ${colors.map((c, i) => `${c} ${i * step}% ${(i + 1) * step}%`).join(", ")})`;
}
function needStats(id) {
  const c = cache(); if (c.stats.has(id)) return c.stats.get(id);
  const sub = Surface.subtree(S, id);
  const caps = [...new Set(S.tags.filter(t => sub.includes(t.need) && IX.caps.has(t.capability)).map(t => t.capability))];
  let standing = 0, total = 0, decided = 0;
  for (const cap of caps) { const all = IX.routesByCap.get(cap) || []; total += all.length; standing += all.filter(r => !Surface.isStruck(S, r.id)).length; if (Surface.decisionOf(S, cap)) decided++; }
  const out = { caps: caps.length, standing, total, decided };
  c.stats.set(id, out); return out;
}
const needText = (id) => { const n = Surface.need(S, id); return n ? (n.statement || (n.parent === null ? "The founding principle (not written yet)" : "(blank)")) : `(missing need ${id})`; };
/* plain-language glosses (docs/data/capability-glosses.json, served at /api/glosses); absent = original wording */
let GL = { capabilities: {}, routes: {} };
const gl = (id) => (GL.capabilities || {})[id] || null;
const capWording = (id) => (IX.caps.get(id) || {}).text || `(capability ${id} is not in this inventory)`;
const capText = (id) => (gl(id) && gl(id).title) || capWording(id);
const routePlain = (r) => ((GL.routes || {})[r.id] || {}).plain || "";
function origLine(id, cls) { return gl(id) && gl(id).title ? `<div class="orig ${cls || ""}" ${tip("The card's own wording.")}>${code(capWording(id))}</div>` : ""; }
function glossSummary(id, cls) {
  const s = gl(id) && gl(id).summary; if (!s) return "";
  const un = /^UNCLEAR:\s*/.test(s);
  return `<div class="gsum ${un ? "unclear" : ""} ${cls || ""}" ${un ? tip("Whoever wrote this plain summary wasn't sure what the card means. Worth a follow-up.") : ""}>${un ? `<span class="unc">Unclear</span> ` : ""}${code(s.replace(/^UNCLEAR:\s*/, ""))}</div>`;
}
const cardOf = (capId) => IX.cards.get((IX.caps.get(capId) || {}).card) || null;
const routeLabel = (r) => r.label || r.id;
function needPath(id) { return [...Surface.ancestors(S, id)].reverse().concat(id); }
const openFollowups = (type, id) => Surface.followupsOf(S, type, id).filter(f => f.status === "open");

/* plain-English chips */
function stateChip(cap) {
  const d = Surface.decisionOf(S, cap);
  if (!d) return `<span class="chip out" ${tip("Undecided: no route selected yet, and it hasn't been recorded as open.")}>Undecided</span>`;
  if (d.state === "selected") return `<span class="chip ok" ${tip(`Selected: ${d.routes.map(r => routeLabel(IX.routes.get(r) || { id: r })).join(" + ")}, decided in ${d.decided_by}.`)}>Selected</span>`;
  return `<span class="chip warn" ${tip("Open: deliberately left undecided because the story that would decide it isn't written yet. " + (d.reopen ? "Reopen when: " + d.reopen : ""))}>Open</span>`;
}
function routesChip(cap) {
  const all = (IX.routesByCap.get(cap) || []).length, st = Surface.surviving(S, IX, cap).length;
  return `<span class="chip" ${tip(`${st} of its ${plural(all, "route")} still standing${all - st ? `; ${all - st} struck` : ""}. A route is one way of building it.`)}>${st} of ${plural(all, "route")} standing</span>`;
}
function ownChip(cap, clickable) {
  const o = Surface.ownership(S, cap);
  const nm = (id) => cut(needText(id), 40);
  if (o.status === "shared") return `<span class="chip acc" ${tip(`Shared: the needs it sits under fall in ${o.sessions.length} different sessions (${o.sessions.map(nm).join("; ")}). Each session only suggests a route; the conflict pass decides.`)}>Shared by ${o.sessions.length} sessions</span>`;
  if (o.status === "owned") return `<span class="chip acc" ${tip(`Owned: every need it sits under falls inside one session (${nm(o.sessions[0])}). That session decides it.`)}>Owned by one session</span>`;
  if (o.status === "unpartitioned") return `<span class="chip" ${tip("Placed, but none of its needs is inside a session yet. Mark a need as a session in its panel.")}>No session yet</span>`;
  if (o.status === "no_owner") return `<span class="chip" ${tip("Marked as having no narrative owner: no need in the story calls for it.")}>No narrative owner</span>`;
  return `<span class="chip warn" ${tip("Unplaced: not under any need yet, and not marked as having no owner. It waits on the Capabilities tab.")}>Unplaced</span>`;
}
function fuChip(type, id) {
  const n = openFollowups(type, id).length;
  return n ? `<span class="chip dig" ${tip(`${plural(n, "open follow-up")} on this. See the Follow-ups tab.`)}>${ICON.flag.replace("<svg", '<svg style="width:11px;height:11px"')} ${n}</span>` : "";
}
function weightWord(r) { return r.weight_text || (r.weight ? r.weight[0].toUpperCase() + r.weight.slice(1) : null); }
const PROV = { explicit: "stated on the route", inherited: "inherited from the capability row", unstated: "not stated on the card" };
function flagChips(r, noGroup) {
  const out = [];
  if (/already built/i.test(r.label || "")) out.push(`<span class="chip ok" ${tip("Already built: this route exists in the mod today.")}>Already built</span>`);
  if (r.as_specced) out.push(`<span class="chip acc" ${tip("As specced: this is the route the current spec describes.")}>As specced</span>`);
  if (r.not_recommended) out.push(`<span class="chip bad" ${tip("The card recommends against this route" + (r.marks.length ? ": " + r.marks.join("; ") : "."))}>Not recommended</span>`);
  if (r.fallback_only) out.push(`<span class="chip warn" ${tip("Fallback only: the card keeps this route in case the preferred one fails.")}>Fallback only</span>`);

  if (r.group && !noGroup) out.push(`<span class="chip out" ${tip(`Part of the “${r.group}” group. Routes in different groups of one capability combine rather than compete.`)}>${esc(r.group)}</span>`);

/* ================= Tree ================= */

function needLi(n) {

function needCard(n, open, hasKids) {
  const isRoot = n.parent === null, key = "n|" + n.id;

  } else text = `<div class="ntext" data-dbl="rename" data-id="${esc(n.id)}" ${tip("Double-click to rename.")}>${esc(n.statement)}</div>`;
  const badges = st.caps ? `
      <span class="chip" ${tip(`${plural(st.caps, "capability", "capabilities")} linked here or anywhere below.`)}>${plural(st.caps, "capability", "capabilities")}</span>
      <span class="chip" ${tip(`${st.standing} of the ${st.total} routes under these capabilities are still standing; ${st.total - st.standing} struck.`)}>${st.standing}/${st.total} routes</span>
      <span class="chip ${st.decided === st.caps ? "ok" : ""}" ${tip(`${st.decided} of ${st.caps} capabilities have a decision (a selected route, or recorded as open).`)}>${st.decided}/${st.caps} decided</span>`
    : (isRoot ? "" : `<span class="chip out" ${tip("No capability linked here or below yet. Use + Add → Link capability.")}>No capabilities yet</span>`);
  const sessPill = sess ? `<span class="chip solid" ${tip("A session: one sitting with an agent covering this branch.")}>Session</span>` : "";
  const desc = n.description ? `<div class="ndesc">${esc(n.description)}</div>` : "";
  return `<div class="nnode ${isRoot ? "root" : ""} ${selIs("need", n.id) ? "sel" : ""}" data-key="${esc(key)}" data-act="selNeed" data-id="${esc(n.id)}" style="--c:${colorOfNeed(n.id)}">
      ${isRoot ? `<div class="eyebrow" style="margin-bottom:4px">Founding principle</div>` : ""}
      <div class="nhead"><button class="chev ${open ? "open" : ""} ${hasKids ? "" : "none"}" data-act="toggle" data-key="${esc(key)}" ${tip(open ? "Collapse" : "Expand")}>${ICON.chev}</button>${text}</div>
      ${desc}
      ${badges || sessPill ? `<div class="nmeta">${sessPill}${badges}${fuChip("need", n.id)}</div>` : ""}
      <div class="nfoot">${isRoot && !n.statement ? `<span class="small muted">Press <kbd>Enter</kbd> to save. Every need hangs from this line.</span>` : ""}<span class="spacer"></span>
        <button class="iconbtn hov" data-act="flag" data-tt="need" data-id="${esc(n.id)}" ${tip("Flag: “this is wrong” or “dig into this”.")}>${ICON.flag}</button>
        ${n.statement ? `<button class="addbtn" data-act="addMenu" data-id="${esc(n.id)}" ${tip("Add a child need, or link a capability here.")}>${ICON.plus}Add</button>` : ""}</div>
    </div>`;
}

function newNeedCard(parent) {
  return `<div class="newcard"><input type="text" id="newNeed" data-parent="${esc(parent.id)}" placeholder="A new need under “${esc(cut(parent.statement, 30))}”">
    <div class="small muted"><kbd>Enter</kbd> adds it and keeps this open for the next · <kbd>Esc</kbd> closes</div></div>`;
}

function capNode(cap, needId) {
  const key = `c|${needId}|${cap}`, open = isOpen(key);
  const card = cardOf(cap);
  const others = placementsOf(cap).filter(x => x !== needId);
  const also = others.length ? `<span class="chip out click" data-act="alsoUnder" data-cap="${esc(cap)}" data-need="${esc(others[0])}" ${tip("Also under: " + others.map(x => "“" + needText(x) + "”").join(", ") + ". Click to jump there.")}>${others.slice(0, 3).map(x => `<span class="sw" style="background:${colorOfNeed(x)}"></span>`).join("")}<span class="el">also under ${esc(needText(others[0]))}</span>${others.length > 1 ? ` +${others.length - 1}` : ""}</span>` : "";
  let routes = "";
  if (open) {
    routes = `<div class="rlist">${(IX.routesByCap.get(cap) || []).map(r => {
      const struck = Surface.isStruck(S, r.id);
      return `<div class="rnode ${struck ? "struck" : ""} ${selIs("route", r.id) ? "sel" : ""}" data-key="r|${esc(needId)}|${esc(r.id)}" data-act="selRoute" data-id="${esc(r.id)}" data-need="${esc(needId)}" ${tip(struck ? "Struck: " + (Surface.globalOf(S, r.id) || {}).reason : (r.summary || ""))}>
        <span class="rl">${esc(routeLabel(r).replace(/\s*\(.*\)\s*$/, "") || routeLabel(r))}</span><span class="rs">${r.group ? `<b>${esc(r.group)}:</b> ` : ""}${code(routePlain(r) || r.summary)}</span><span class="rw">${esc(r.weight || "")}</span></div>`;
    }).join("")}</div>`;
  }
  return `<div class="cnode ${selIs("cap", cap, needId) ? "sel" : ""}" data-key="${esc(key)}" data-act="selCap" data-id="${esc(cap)}" data-need="${esc(needId)}" style="--stripe:${stripe(capColors(cap))}">
      <div class="nhead"><button class="chev ${open ? "open" : ""}" data-act="toggle" data-key="${esc(key)}" ${tip(open ? "Hide routes" : "Show routes")}>${ICON.chev}</button><div class="ctext">${code(capText(cap))}</div></div>${origLine(cap, "c")}
      <div class="cmeta"><span class="cn">${esc(card ? card.title : "")}</span><span class="id">${esc(cap)}</span><span style="flex:1"></span>
        <button class="iconbtn hov" style="width:22px;height:22px" data-act="flag" data-tt="capability" data-id="${esc(cap)}" ${tip("Flag: “this is wrong” or “dig into this”.")}>${ICON.flag}</button></div>
      <div class="cbadges">${routesChip(cap)}${stateChip(cap)}${fuChip("capability", cap)}${also}</div>
      ${routes}
    </div>`;
}

/* reveal a need / a capability placement / a route in the tree */
function revealNeed(id) { for (const a of Surface.ancestors(S, id)) setOpen("n|" + a, true); }
function jumpToNeed(id) { UI.tab = "tree"; LS.set("tab", "tree"); revealNeed(id); setOpen("n|" + id, true); openPanel({ type: "need", id }); UI.flashKey = "n|" + id; render(); }
function jumpToCap(cap, need) {
  need = need || placementsOf(cap)[0];
  if (!need) { openFullPage(cap); return; }
  UI.tab = "tree"; LS.set("tab", "tree"); revealNeed(need); setOpen("n|" + need, true);
  openPanel({ type: "cap", id: cap, need }); UI.flashKey = `c|${need}|${cap}`; render();
}
function jumpToRoute(rid) {
  const r = IX.routes.get(rid); if (!r) return;
  const need = placementsOf(r.capability)[0];
  if (!need) { openPanel({ type: "route", id: rid }); render(); return; }
  UI.tab = "tree"; LS.set("tab", "tree"); revealNeed(need); setOpen("n|" + need, true); setOpen(`c|${need}|${r.capability}`, true);
  openPanel({ type: "route", id: rid, need }); UI.flashKey = `r|${need}|${rid}`; render();
}
function jumpTo(type, id) { if (type === "need") jumpToNeed(id); else if (type === "capability") jumpToCap(id); else jumpToRoute(id); }

/* ================= Detail panel ================= */
function openPanel(p) {
  if (UI.sel && !(UI.sel.type === p.type && UI.sel.id === p.id)) { UI.back.push(UI.sel); if (UI.back.length > 40) UI.back.shift(); }
  UI.sel = p; UI.decMode = null; UI.confirmDelete = false; UI._panelScrollReset = true;
}
function renderPanel() {
  const p = $("panel"), body = $("body");
  const valid = UI.sel && (UI.sel.type === "need" ? Surface.need(S, UI.sel.id) : UI.sel.type === "cap" ? IX.caps.has(UI.sel.id) : UI.sel.type === "route" ? IX.routes.has(UI.sel.id) : UI.sel.type === "doc");
  if (!valid) { UI.sel = null; p.hidden = true; body.classList.remove("with-panel"); return; }
  p.hidden = false; body.classList.add("with-panel"); body.classList.toggle("wide", !!UI.wide);
  const top = UI._panelScrollReset ? 0 : p.scrollTop; UI._panelScrollReset = false;
  const typeName = { need: "Need", cap: "Capability", route: "Route", doc: "Document" }[UI.sel.type];
  const head = `<div class="ph">${UI.back.length ? `<button class="btn ghost sm" data-act="back" ${tip("Back to what you were looking at before.")}>${ICON.back}Back</button>` : ""}
      <span class="eyebrow" style="margin-left:4px">${typeName}</span><span style="flex:1"></span>
      <button class="btn ghost sm" data-act="widen" ${tip(UI.wide ? "Back to a narrow panel." : "Widen the panel to compare more routes side by side.")}>${UI.wide ? "Narrow" : "Widen"}</button>
      ${UI.sel.type !== "doc" ? `<button class="btn ghost sm" data-act="showInTree" ${tip("Find this in the tree.")}>${ICON.target}Show in tree</button>` : ""}
      <button class="iconbtn" data-act="closePanel" ${tip("Close (Esc)")}>${ICON.x}</button></div>`;
  p.innerHTML = head + `<div class="pb">${({ need: panelNeed, cap: panelCap, route: panelRoute, doc: panelDoc }[UI.sel.type])()}</div>`;
  p.scrollTop = top;
}

function crumbs(id, includeSelf) {
  const path = needPath(id).slice(1); if (!includeSelf) path.pop();
  if (!path.length) return "";
  return `<div class="crumbs">${path.map((x, i) => `${i ? "<span>›</span>" : ""}<button class="link" data-act="openNeed" data-id="${esc(x)}">${esc(cut(needText(x), 38))}</button>`).join("")}</div>`;
}
function followupSection(type, id) {
  const list = Surface.followupsOf(S, type, id);
  return `<div class="sec"><h3>Follow-ups<span class="spacer"></span><button class="btn sm" data-act="flag" data-tt="${type}" data-id="${esc(id)}">${ICON.flag}Flag this</button></h3>
    ${list.length ? `<div class="list">${list.map(fuRow).join("")}</div>` : `<div class="small muted">Nothing flagged. Use “Flag this” to queue “this is wrong” or “dig into this” for an agent.</div>`}</div>`;
}
function fuRow(f) {
  return `<div class="box" style="display:flex;gap:10px;align-items:flex-start;${f.status === "done" ? "opacity:.6" : ""}">
    ${f.kind === "wrong" ? `<span class="chip bad">This is wrong</span>` : `<span class="chip dig">Dig into this</span>`}
    <div style="flex:1;font-size:13.5px">${esc(f.note) || `<span class="muted">No note.</span>`}<div class="small muted">${esc(f.created.slice(0, 10))} · ${f.status === "done" ? "done" : "open"}</div></div>
    <button class="btn sm" data-act="fuToggle" data-id="${esc(f.id)}">${f.status === "done" ? "Reopen" : "Mark done"}</button></div>`;
}

/* ---- need ---- */
function panelNeed() {
  const n = Surface.need(S, UI.sel.id), isRoot = n.parent === null;

  const kids = Surface.children(S, n.id);
  const st = needStats(n.id);
  const title = UI.renaming === "panel:" + n.id
    ? `<input type="text" id="panelRename" data-rename="${esc(n.id)}" value="${esc(n.statement)}" style="width:100%;font-size:18px;font-weight:600;margin:6px 0 10px">`
    : `<div class="ptitle edit" data-act="panelRename" ${tip("Click to rename.")}>${esc(n.statement) || `<span class="muted">Write the founding principle</span>`}</div>`;
  const sessLine = sess ? `This need is a <b>session</b>: one sitting with an agent will cover it and everything below it.`
    : inS ? `Inside the session <button class="link" data-act="openNeed" data-id="${esc(inS)}">“${esc(cut(needText(inS), 50))}”</button>.`
    : `Not inside any session yet. Its capabilities count as “no session yet” until a session covers it.`;
  const del = UI.confirmDelete ? `<div class="box" style="border-color:#EBC3BE;background:var(--bad-soft);margin-top:10px;font-size:13.5px">
      Delete this need? ${kids.length ? `Its ${plural(kids.length, "child need")} move up to its parent. ` : ""}${direct.length ? `${plural(direct.length, "capability link")} ${direct.length === 1 ? "is" : "are"} removed (the capabilities stay in the inventory). ` : ""}You can undo.
      <div class="row" style="margin-top:8px"><button class="btn danger solid sm" data-act="deleteNeed">Delete it</button><button class="btn sm" data-act="cancelDelete">Keep it</button></div></div>` : "";
  return `<div class="row">${sess ? `<span class="chip solid">Session</span>` : ""}${fuChip("need", n.id)}</div>
    ${title}
    ${isRoot ? `<div class="small muted">The founding principle: the root every need hangs from.</div>` : crumbs(n.id, false)}
    <div class="row" style="margin-top:14px">
      <button class="btn sm" data-act="startAdd" data-id="${esc(n.id)}">${ICON.need}New child need</button>
      <button class="btn sm" data-act="linkCap" data-id="${esc(n.id)}">${ICON.link}Link capability</button>
      ${isRoot ? "" : `<button class="btn sm" data-act="moveNeed" data-id="${esc(n.id)}">${ICON.move}Move under…</button>
      <button class="iconbtn" data-act="reorder" data-dir="-1" ${tip("Move left among its siblings")}>${ICON.up}</button><button class="iconbtn" data-act="reorder" data-dir="1" ${tip("Move right among its siblings")}>${ICON.down}</button>
      <button class="iconbtn" data-act="askDelete" ${tip("Delete this need")}>${ICON.trash}</button>`}
    </div>${del}
    <div class="sec"><h3>Description</h3>
      <textarea id="needDesc" rows="3" placeholder="What this need means as it plays: who feels it, when, and why it matters. Saved when you click away.">${esc(n.description || "")}</textarea></div>
    ${isRoot ? "" : `<div class="sec"><h3>Session</h3><div class="small" style="margin-bottom:8px">${sessLine}</div>
      <button class="btn sm" data-act="toggleSession" ${tip("A session is one sitting with an agent covering one branch. Sessions never nest: marking this unmarks any session above or below it.")}>${sess ? "Stop being a session" : "Make this a session"}</button></div>`}
    <div class="sec"><h3>Capabilities linked here <span class="count">${direct.length}</span>${st.caps > direct.length ? `<span class="small muted" style="text-transform:none;letter-spacing:0;font-weight:500">${st.caps} including needs below</span>` : ""}</h3>
      ${direct.length ? `<div class="list">${direct.map(t => capItem(t.capability, n.id)).join("")}</div>` : `<div class="empty">No capability is linked directly to this need. <b>Link capability</b> above searches all ${IX.inv.capabilities.length}.</div>`}</div>
    ${kids.length ? `<div class="sec"><h3>Child needs <span class="count">${kids.length}</span></h3><div class="list">${kids.map(k => { const s2 = needStats(k.id); return `<div class="item" data-act="openNeed" data-id="${esc(k.id)}"><span class="chip" style="padding:0;width:10px;height:10px;background:${colorOfNeed(k.id)}"></span><div class="grow"><div class="t">${esc(k.statement)}</div><div class="s">${plural(s2.caps, "capability", "capabilities")} · ${s2.standing}/${s2.total} routes standing</div></div></div>`; }).join("")}</div></div>` : ""}
    ${followupSection("need", n.id)}`;
}
function capItem(cap, needId) {
  const card = cardOf(cap);
  return `<div class="item" data-act="openCap" data-id="${esc(cap)}" data-need="${esc(needId || "")}">
    <div class="grow"><div class="t">${code(capText(cap))}</div><div class="s">${esc(card ? card.title : "")} <span class="id">${esc(cap)}</span></div>
    <div class="row" style="margin-top:6px;gap:4px">${routesChip(cap)}${stateChip(cap)}${fuChip("capability", cap)}</div></div></div>`;
}

/* ---- capability ---- */
function whereItSits(id) {
  const tags = Surface.tagsOf(S, id), own = Surface.ownership(S, id), noo = Surface.noOwner(S, id);
  const place = tags.length ? tags.map(t => `<div class="placement"><span class="sw" style="background:${colorOfNeed(t.need)}"></span>
      <div class="grow"><button class="link" style="font-weight:600;color:var(--ink)" data-act="openNeed" data-id="${esc(t.need)}">${esc(needText(t.need))}</button>
      ${Surface.need(S, t.need).parent !== null ? crumbs(t.need, false) : ""}
      ${Surface.sessionOf(S, t.need) ? `<div class="small muted">Session: ${esc(cut(needText(Surface.sessionOf(S, t.need)), 50))}</div>` : ""}</div>
      <button class="btn ghost sm" data-act="alsoUnder" data-cap="${esc(id)}" data-need="${esc(t.need)}" ${tip("Show this placement in the tree.")}>${ICON.target}</button>
      <button class="btn sm" data-act="unlink" data-cap="${esc(id)}" data-need="${esc(t.need)}" ${tip("Take it off this need, with a one-line reason.")}>Unlink…</button></div>`).join("")
    : noo ? `<div class="box row" style="justify-content:space-between"><span><span class="chip">No narrative owner</span> <span class="small">${esc(noo.note) || ""}</span></span><button class="btn sm" data-act="clearNoOwner" data-cap="${esc(id)}">Remove the mark</button></div>`
    : `<div class="empty">Not placed yet. <b>Link it to a need</b>, or mark it as having <b>no narrative owner</b>.</div>`;
  const ownLine = own.status === "shared" ? `<div class="small" style="margin-top:10px">Shared between sessions ${own.sessions.map(s2 => `<button class="link" data-act="openNeed" data-id="${esc(s2)}">“${esc(cut(needText(s2), 40))}”</button>`).join(" and ")}. Each suggests a route; the conflict pass decides.</div>`
    : own.status === "owned" ? `<div class="small" style="margin-top:10px">Owned by the session <button class="link" data-act="openNeed" data-id="${esc(own.sessions[0])}">“${esc(cut(needText(own.sessions[0]), 50))}”</button>, which decides it.</div>`
    : own.status === "unpartitioned" ? `<div class="small muted" style="margin-top:10px">None of its needs is inside a session yet, so it is neither owned nor shared.</div>` : "";
  return place + ownLine;
}
function cardFraming(id) {
  const card = cardOf(id);
  const framing = card ? `<details class="framing" ${UI.framingOpen ? "open" : ""} data-framing><summary>${ICON.chev}What the card “${esc(card.title)}” says<span class="small muted" style="font-weight:500">· the story can ${arr(card.story_can).length} things, cannot ${arr(card.story_cannot).length}</span></summary><div class="inner">
      <dl class="kv"><dt>Possible</dt><dd>${esc(card.possible)}</dd><dt>Multiplayer</dt><dd>${esc(card.multiplayer)}</dd></dl>
      ${arr(card.story_can).length ? `<div class="frhead can">The story can</div><ul class="frlist">${card.story_can.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${arr(card.story_cannot).length ? `<div class="frhead cannot">The story cannot</div><ul class="frlist">${card.story_cannot.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </div></details>` : "";
  return framing;
}

function panelCap() {
  const id = UI.sel.id, c = IX.caps.get(id), card = cardOf(id);
  const routes = IX.routesByCap.get(id) || [];
  const tags = Surface.tagsOf(S, id);
  const own = Surface.ownership(S, id);
  const noo = Surface.noOwner(S, id);
  const note = Surface.noteOf(S, id);
  const standing = routes.filter(r => !Surface.isStruck(S, r.id));

  const place = whereItSits(id), ownLine = "", framing = cardFraming(id);

  return `<div class="row"><span class="small muted">${esc(card ? card.title : c.card)}</span><span class="id">${esc(id)}</span><span style="flex:1"></span><button class="btn sm" data-act="openFullPage" data-id="${esc(id)}" ${tip("Open this capability as a full page on the Capabilities tab.")}>Open full page</button></div>
    <div class="ptitle">${code(capText(id))}</div>${glossSummary(id)}${origLine(id)}
    <div class="row" style="gap:6px">${ownChip(id)}${stateChip(id)}${routesChip(id)}${fuChip("capability", id)}</div>
    <div class="row" style="margin-top:14px">
      <button class="btn sm primary" data-act="linkNeed" data-cap="${esc(id)}">${ICON.link}Link to a need</button>
      ${tags.length || noo ? "" : `<button class="btn sm" data-act="noOwner" data-cap="${esc(id)}" ${tip("No need in the story calls for this capability.")}>No narrative owner</button>`}
      <button class="btn sm" data-act="flag" data-tt="capability" data-id="${esc(id)}">${ICON.flag}Flag</button>
    </div>
    <div class="sec"><h3>Where it sits</h3>${place}${ownLine}</div>
    <div class="sec"><h3>What the card says about this row</h3>
      <dl class="kv"><dt>Possible</dt><dd>${esc(c.possible)}</dd><dt>Multiplayer</dt><dd>${esc(c.multiplayer)}</dd>
      ${arr(c.notes).length ? `<dt>Card note</dt><dd>${arr(c.notes).map(esc).join("<br>")}</dd>` : ""}</dl>
      <div style="margin-top:12px">${framing}</div></div>
    <div class="sec"><h3>Read the spec</h3>${arr(c.spec_link).length ? arr(c.spec_link).map(l => specBlock(l)).join("") : `<div class="small muted">The card links no spec section for this row.</div>`}</div>
    <div class="sec"><h3>Routes, side by side <span class="count">${standing.length}/${routes.length} standing</span></h3>
      <div class="small muted" style="margin:-4px 0 10px">Each column is one way to build it. Click a route's heading for everything about it. Struck routes are greyed and folded, with their reason.</div>
      ${routeCompare(id, routes)}</div>
    ${decisionSection(id, routes, tags, own)}
    <div class="sec"><h3>Your note</h3><textarea id="capNote" rows="2" placeholder="Anything you want to remember about this capability. Saved when you click away.">${esc(note)}</textarea></div>
    ${followupSection("capability", id)}`;
}

/** When the standing routes that combine at all all combine with each other, one sentence says so; otherwise null. */
function combineSummary(routes) {
  const st = routes.filter(r => !Surface.isStruck(S, r.id));
  const any = (r) => st.some(o => o !== r && Surface.composes(IX, r.id, o.id));
  const yes = st.filter(any), no = st.filter(r => !any(r));
  if (yes.length < 2 || !Surface.allCompose(IX, yes.map(r => r.id))) return null;
  return no.length ? `All routes combine except ${no.map(r => esc(routeLabel(r))).join(", ")}, which combine${no.length === 1 ? "s" : ""} with none` : "All routes combine";
}
function routeCompare(cap, routes) {
  const dec = Surface.decisionOf(S, cap);
  const order = [...routes.filter(r => !Surface.isStruck(S, r.id)), ...routes.filter(r => Surface.isStruck(S, r.id))];
  const kindOf = (r) => arr(r.kind).length ? arr(r.kind).map(k => ({ xml: "XML defs", patch: "Harmony patch", cs: "C# code" }[k] || k)).join(" + ") : r.kind_text;
  const combos = (r) => arr(r.composes_with).map(x => { const rr = IX.routes.get(x); return rr ? `<button class="link" data-act="openRoute" data-id="${esc(x)}">${esc(rr.capability === cap ? routeLabel(rr) : cut(capText(rr.capability), 30) + " · " + routeLabel(rr))}</button>` : esc(x); }).join(", ");
  const ATTR = [["weight", "Weight", weightWord], ["multiplayer", "Multiplayer", (r) => r.multiplayer], ["kind", "Kind", kindOf], ["carrier", "Carrier", (r) => r.carrier], ["composes", "Combines with", (r) => arr(r.composes_with).join(",") || null]];
  const shown = (r, f, get) => {
    const v = get(r); const pv = (r.provenance || {})[f];
    if (f === "composes") return v ? combos(r) : `<span class="muted">The card names none</span>`;
    if (!v) return `<span class="muted">${pv === "unstated" ? "Not stated on the card" : "Not stated"}</span>`;
    return `${esc(v)}${pv && pv !== "explicit" ? `<span class="prov ${pv}">${esc(PROV[pv])}</span>` : ""}`;
  };
  // hoist what every route shares; the columns keep only what differs
  const unstated = [], common = [], differ = [];
  const allComb = combineSummary(routes);
  if (allComb) common.push(`<div><b>Combines with:</b> ${allComb}</div>`);
  for (const a of ATTR) {
    if (allComb && a[0] === "composes") continue;
    const vals = routes.map(r => a[2](r) || "");
    if (routes.length > 1 && vals.every(v => !v)) { if (a[0] === "composes") common.push(`<div><b>Combines with:</b> <span class="muted">the card names none</span></div>`); else unstated.push(a[1]); }
    else if (routes.length > 1 && vals.every(v => v === vals[0])) common.push(`<div><b>${a[1]}:</b> ${shown(routes[0], a[0], a[2])}</div>`);
    else differ.push(a);
  }
  if (unstated.length) common.push(`<div><b>${unstated.length > 1 ? unstated.slice(0, -1).join(", ") + " and " + unstated[unstated.length - 1].toLowerCase() : unstated[0]}:</b> <span class="muted">not stated on the card</span></div>`);
  const allLine = common.length ? `<div class="allroutes"><span class="lab">All routes</span>${common.join("")}</div>` : "";
  const span = 3 + differ.length;
  const cols = order.map(r => {
    const struck = Surface.isStruck(S, r.id);
    const selected = dec && dec.state === "selected" && dec.routes.includes(r.id);
    const head = `<div class="rh" data-act="openRoute" data-id="${esc(r.id)}" ${tip("Open everything about this route.")}><b>${esc(routeLabel(r))}</b>${selected ? `<span class="chip ok">Selected</span>` : ""}<div class="row" style="gap:4px">${flagChips(r, true)}</div></div>`;
    if (struck) {

        <div class="acts"><button class="btn sm" data-act="unstrike" data-r="${esc(r.id)}">Unstrike</button></div></div>`;
    }
    return `<div class="rcard ${selected ? "selected" : ""}" style="grid-row:span ${span}">${head}
      <div><span class="lab">${r.group ? esc(r.group) : "What it gets us"}</span>${code(routeText(r))}</div>
      ${differ.map(a => `<div><span class="lab">${a[1]}</span>${shown(r, a[0], a[2])}</div>`).join("")}
      <div class="acts"><button class="btn sm" data-act="strike" data-r="${esc(r.id)}" ${tip("Strike it for every need, with a one-line reason.")}>Strike…</button><button class="iconbtn" data-act="flag" data-tt="route" data-id="${esc(r.id)}" ${tip("Flag this route")}>${ICON.flag}</button></div></div>`;
  }).join("");
  return `${allLine}<div class="cmpwrap"><div class="cmp">${cols}</div></div>`;
}

  else if (mode === "open") form = `<div class="box" style="margin-top:8px"><div class="small muted">Tick the routes still in the running.</div>${ticks("candR", dec && dec.state === "open" ? dec.candidates : surv.map(r => r.id))}
      <dl class="kv" style="margin-top:10px"><dt>What is known</dt><dd><input type="text" id="openKnown" style="width:100%" value="${esc(dec && dec.state === "open" ? dec.known : "")}"></dd>

      <div class="row" style="margin-top:10px"><button class="btn primary sm" data-act="setOpen" data-cap="${esc(id)}">Record as open</button><button class="btn sm" data-act="decMode" data-cap="${esc(id)}" data-v="">Cancel</button></div></div>`;
  // layer 2 summary: which needs suggest / reject / leave open which route

      : `<div class="small muted">No need has suggested or rejected a route yet. Open a route to mark it for a need.</div>`) : "";
  return `<div class="sec"><h3>Decision<span class="spacer"></span>

/* ---- spec reader ---- */
function specKey(link) { return link; }
function specBlock(link, openDefault) {
  const [path, anchor] = link.split("#");
  const k = specKey(link);
  if (openDefault && !UI.specOpen.has("closed:" + k)) UI.specOpen.add(k);
  const open = UI.specOpen.has(k);
  const got = SPEC.get(k);
  if (!got) fetchSpec(path, anchor || "");
  const title = got && got.data ? got.data.title : (anchor ? anchor.replace(/-+/g, " ").replace(/^\d+ /, "").replace(/^./, c => c.toUpperCase()) : path.split("/").pop());
  let body = "";
  if (open) {
    if (!got || got.loading) body = `<div class="md"><p class="muted">Loading…</p></div>`;
    else if (got.error) body = `<div class="md"><p class="muted">Could not load: ${esc(got.error)}</p></div>`;
    else body = `<div class="md">${mdRender(got.data.markdown, path)}${got.data.found || !anchor ? "" : `<div class="note">The section “${esc(anchor)}” was not found, so the whole document is shown.</div>`}
      <div class="row" style="margin-top:10px"><button class="btn sm ghost" data-act="openDoc" data-path="${esc(path)}" data-anchor="${esc(anchor || "")}">Open in the panel on its own</button><button class="btn sm ghost" data-act="openDoc" data-path="${esc(path)}" data-anchor="">Whole document</button></div></div>`;
  }
  return `<div class="spec"><button class="spech" data-act="toggleSpec" data-k="${esc(k)}" ${tip(open ? "Fold the spec section away." : "Read this section of the spec here.")}>${ICON.doc}<span class="t">${esc(title)}</span><span class="p">${esc(path.replace(/^docs\//, ""))}</span>${ICON.chev.replace("<svg", `<svg style="width:14px;height:14px;color:var(--ink-3);transform:rotate(${open ? 90 : 0}deg)"`)}</button>${body}</div>`;
}
async function fetchSpec(path, anchor) {
  const k = path + (anchor ? "#" + anchor : "");
  if (SPEC.has(k)) return;
  SPEC.set(k, { loading: true });
  try {
    const r = await fetch(`/api/doc?path=${encodeURIComponent(path)}&anchor=${encodeURIComponent(anchor)}`);
    if (!r.ok) throw new Error(await r.text());
    SPEC.set(k, { data: await r.json() });
  } catch (e) { SPEC.set(k, { error: e.message }); }
  renderPanel(); if (UI.tab === "caps") renderMain();
}
function panelDoc() {
  const { path, anchor } = UI.sel; const k = path + (anchor ? "#" + anchor : "");
  const got = SPEC.get(k); if (!got) fetchSpec(path, anchor);
  if (!got || got.loading) return `<p class="muted">Loading ${esc(path)}…</p>`;
  if (got.error) return `<p>Could not load ${esc(path)}: ${esc(got.error)}</p>`;
  return `<div class="row"><span class="id">${esc(path)}${anchor ? "#" + esc(anchor) : ""}</span></div>
    ${anchor ? `<div class="row" style="margin:8px 0"><button class="btn sm" data-act="openDoc" data-path="${esc(path)}" data-anchor="">Read the whole document</button></div>` : ""}
    ${got.data.found || !anchor ? "" : `<div class="md"><div class="note">The section “${esc(anchor)}” was not found, so the whole document is shown.</div></div>`}
    <div class="md full">${mdRender(got.data.markdown, path)}</div>`;
}

/* ---- a small markdown renderer (headings, lists, tables, code, quotes, links) ---- */
function joinPath(base, rel) {
  const out = base.split("/").slice(0, -1);
  for (const seg of rel.split("/")) { if (seg === "..") out.pop(); else if (seg && seg !== ".") out.push(seg); }
  return out.join("/");
}
function mdLink(txt, url, base) {
  const u = url.replace(/&amp;/g, "&");
  if (/^https?:/i.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener">${txt}</a>`;
  const [p, a] = u.split("#");
  const path = p ? joinPath(base, p) : base;
  if (/\.md$/i.test(path) && path.startsWith("docs/")) return `<a href="#" data-act="openDoc" data-path="${esc(path)}" data-anchor="${esc(a || "")}">${txt}</a>`;
  return `<span class="deadlink" ${tip("Not viewable here: " + path)}>${txt}</span>`;
}
function mdInline(t, base) {
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0001${codes.length - 1}\u0001`; });
  t = esc(t);
  t = t.replace(/!?\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, txt, url) => mdLink(txt, url, base));
  t = t.replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^\w])__([^_]+)__(?!\w)/g, "$1<strong>$2</strong>");
  t = t.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>").replace(/(^|[^_\w])_([^_\s][^_]*?)_(?!\w)/g, "$1<em>$2</em>");
  return t.replace(/\u0001(\d+)\u0001/g, (_, k) => `<code>${esc(codes[k])}</code>`);
}
function mdRender(src, base) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  const out = []; let i = 0;
  const isFence = (l) => /^\s*(```|~~~)/.test(l);
  const isList = (l) => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isQuote = (l) => /^\s*>/.test(l);
  const isHr = (l) => /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
  const isTable = (k) => /^\s*\|/.test(lines[k]) && k + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[k + 1]);
  const cells = (r) => { const s = r.trim().replace(/^\|/, "").replace(/\|$/, ""); const o = []; let cur = "", code = false;
    for (let k = 0; k < s.length; k++) { const ch = s[k]; if (ch === "`") code = !code; if (ch === "\\" && s[k + 1] === "|") { cur += "|"; k++; continue; } if (ch === "|" && !code) { o.push(cur.trim()); cur = ""; } else cur += ch; }
    o.push(cur.trim()); return o; };
  const list = (items) => { let h = ""; const st = [];
    for (const it of items) {
      while (st.length && it.ind < st[st.length - 1].ind) h += `</li></${st.pop().tag}>`;
      if (!st.length || it.ind > st[st.length - 1].ind) { const tag = it.ord ? "ol" : "ul"; st.push({ ind: it.ind, tag }); h += `<${tag}><li>`; }
      else h += "</li><li>";
      h += mdInline(it.text, base);
    }
    while (st.length) h += `</li></${st.pop().tag}>`; return h; };
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (isFence(l)) { const f = l.trim().slice(0, 3); const buf = []; i++; while (i < lines.length && !lines[i].trim().startsWith(f)) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    const h = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (h) { out.push(`<div class="mh mh${h[1].length}">${mdInline(h[2], base)}</div>`); i++; continue; }
    if (isHr(l)) { out.push("<hr>"); i++; continue; }
    if (isTable(i)) { const rows = []; while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const hd = cells(rows[0]); out.push(`<div class="tw"><table><thead><tr>${hd.map(c => `<th>${mdInline(c, base)}</th>`).join("")}</tr></thead><tbody>${rows.slice(2).map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c, base)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue; }
    if (isQuote(l)) { const buf = []; while (i < lines.length && isQuote(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, "")); out.push(`<blockquote>${mdRender(buf.join("\n"), base)}</blockquote>`); continue; }
    if (isList(l)) {
      const items = [];
      while (i < lines.length) {
        const x = lines[i];
        if (isList(x)) { const m = x.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/); items.push({ ind: m[1].length, ord: /\d/.test(m[2]), text: m[3] }); i++; }
        else if (x.trim() && /^\s+\S/.test(x) && !isFence(x)) { items[items.length - 1].text += " " + x.trim(); i++; }
        else if (!x.trim() && i + 1 < lines.length && (isList(lines[i + 1]) || /^\s{2,}\S/.test(lines[i + 1]))) i++;
        else break;
      }
      out.push(list(items)); continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isFence(lines[i]) && !/^#{1,6}\s/.test(lines[i]) && !isList(lines[i]) && !isQuote(lines[i]) && !isTable(i)) buf.push(lines[i++].trim());
    if (!buf.length) { out.push(`<p>${mdInline(lines[i].trim(), base)}</p>`); i++; continue; }
    out.push(`<p>${mdInline(buf.join(" "), base)}</p>`);
  }
  return out.join("\n");
}

/* ================= Capabilities ================= */
const RAIL_F = [["all", "All"], ["unplaced", "Unplaced"], ["placed", "Placed"], ["noowner", "No owner"], ["flagged", "Flagged"]];
const isPlaced = (id) => Surface.tagsOf(S, id).length > 0;
const capFlagged = (id) => openFollowups("capability", id).length > 0 || (IX.routesByCap.get(id) || []).some(r => openFollowups("route", r.id).length > 0);
function railMatch(id, f) {
  if (f === "unplaced") return !isPlaced(id) && !Surface.noOwner(S, id);
  if (f === "placed") return isPlaced(id);
  if (f === "noowner") return !!Surface.noOwner(S, id);
  if (f === "flagged") return capFlagged(id);
  return true;
}
function railGroups() {
  const q = UI.rail.q.trim();
  const list = (q ? matchCaps(q) : IX.inv.capabilities).filter(c => railMatch(c.id, UI.rail.f));
  const groups = new Map();
  for (const c of list) {
    const card = IX.cards.get(c.card) || { id: c.card, title: c.card, group: "Other" };
    const g = card.group || "Other";
    if (!groups.has(g)) groups.set(g, new Map());

    ["state", "State", (r) => Surface.isStruck(S, r.id) ? "struck" : "standing", (r) => { const g = Surface.globalOf(S, r.id); return g && g.state === "struck" ? `<span class="chip bad">Struck</span><div class="small" style="margin-top:4px">${esc(g.reason)}</div>` : `<span class="chip ok">Standing</span>`; }, ""],
    ["marks", "Per-need marks", (r) => tags.some(t => markOf(r, t.need)) ? tags.map(t => markOf(r, t.need)).join(",") : "", (r) => tags.map(t => { const s = markOf(r, t.need); return s ? `<div><span class="chip ${s === "suggested" ? "ok" : s === "rejected" ? "bad" : "warn"}" ${tip(needText(t.need))}><span class="sw" style="background:${colorOfNeed(t.need)}"></span>${s === "suggested" ? "Suggested" : s === "rejected" ? "Rejected" : "Open here"}</span></div>` : ""; }).join("") || `<span class="muted">—</span>`, tags.length ? "no need has marked a route yet" : "not under any need yet"],

const CONFLICT_KINDS = [["conflict", "Conflicting", "bad", "The sessions' suggestions are incompatible: they differ and the card does not say they combine, or one session rejects what another suggests."],

  ["decided", "Decided", "ok", "Shared and already selected."]];
function conflictExample() {
  // Built from real inventory rows and two made-up branches. Rendered only; never written to the state file.
  const A = { name: "Example branch: “The colony is worshipped as gods”", color: BRANCH[0] }, B = { name: "Example branch: “The world pushes back”", color: BRANCH[1] };
  const caps = IX.inv.capabilities.map(c => ({ c, rs: IX.routesByCap.get(c.id) || [] })).filter(x => x.rs.length >= 2);
  const agree = caps[0];
  let compose = null, pair = null;
  for (const x of caps) { for (let i = 0; i < x.rs.length && !pair; i++) for (let j = i + 1; j < x.rs.length && !pair; j++) if (Surface.composes(IX, x.rs[i].id, x.rs[j].id)) pair = [x.rs[i], x.rs[j]]; if (pair) { compose = x; break; } }
  const conflict = caps.find(x => x !== agree && x !== compose && !Surface.composes(IX, x.rs[0].id, x.rs[1].id));
  const ex = [];
  if (agree) ex.push(["agree", agree.c.id, [{ ...A, entries: [{ state: "suggested", route: agree.rs[0].id, why: "(made up) it plays best for this branch" }] }, { ...B, entries: [{ state: "suggested", route: agree.rs[0].id, why: "(made up) same pick, different reason" }] }]]);
  if (compose) ex.push(["compose", compose.c.id, [{ ...A, entries: [{ state: "suggested", route: pair[0].id, why: "(made up) this branch needs this half" }] }, { ...B, entries: [{ state: "suggested", route: pair[1].id, why: "(made up) this branch needs the other half" }] }]]);
  if (conflict) ex.push(["conflict", conflict.c.id, [{ ...A, entries: [{ state: "suggested", route: conflict.rs[0].id, why: "(made up) the story wants this one" }] }, { ...B, entries: [{ state: "suggested", route: conflict.rs[1].id, why: "(made up) this branch wants a different one" }, { state: "rejected", route: conflict.rs[0].id, why: "(made up) it would undercut this branch" }] }]]);

    <p class="lede" style="margin:6px 0 0">This is what the tab will show once capabilities are shared between sessions. The capabilities and routes are real rows from the inventory; the two branches and every reason are made up. Nothing here is saved.</p>
    ${ex.map(([k, id, sides]) => { const kd = CONFLICT_KINDS.find(x => x[0] === k); return `<div class="group-h"><h2>${kd[1]}</h2><span class="chip ${kd[2]}">example</span></div><p>${kd[3]}</p>${conflictItem(id, sides, false)}`; }).join("")}</div>`;
}
function viewConflicts() {

  const html = CONFLICT_KINDS.map(([k, t, cls, help]) => { const items = all.filter(c => c.kind === k); return `<div class="group-h"><h2>${t}</h2><span class="chip ${cls}">${items.length}</span></div><p>${help}</p>${items.length ? `<div class="list">${items.map(real).join("")}</div>` : `<div class="small muted">None.</div>`}`; }).join("");
