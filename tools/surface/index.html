/* ================= Search ================= */
function capHay(c) {
  if (!c._hay) {
    const card = IX.cards.get(c.card), g = gl(c.id) || {};
    const routes = IX.routesByCap.get(c.id) || [];
    c._hay = [g.title || "", g.summary || "", c.text, card ? card.title : "", c.id, routes.map(r => r.summary + " " + routePlain(r) + " " + (r.carrier || "")).join(" "), c.possible, c.multiplayer].join(" \n ").toLowerCase();
  }
  return c._hay;
}
function matchCaps(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const out = [];
  for (const c of IX.inv.capabilities) {
    const hay = capHay(c); if (!words.every(w => hay.includes(w))) continue;
    const g = gl(c.id) || {};
    const t = (c.text + " " + (g.title || "") + " " + ((IX.cards.get(c.card) || {}).title || "")).toLowerCase();
    out.push({ c, score: words.reduce((a, w) => a + (t.includes(w) ? 3 : 1), 0) });
  }
  return out.sort((a, b) => b.score - a.score).map(x => x.c);
}

/* ================= Follow-ups ================= */
function fuTarget(f) {
  if (f.target_type === "need") return { kind: "Need", text: needText(f.target), sub: "" };
  if (f.target_type === "capability") return { kind: "Capability", text: capText(f.target), sub: ((cardOf(f.target) || {}).title || "") };
  const r = IX.routes.get(f.target);
  return { kind: "Route", text: r ? `Route ${routeLabel(r)}: ${r.summary}` : f.target, sub: r ? cut(capText(r.capability), 70) : "" };
}
function fuList() { const all = S.followups || []; return UI.fuFilter === "all" ? all : all.filter(f => f.status === UI.fuFilter); }
function viewFollowups() {

/* ================= Popovers ================= */
function openPop(kind, anchorEl, data) {
  const r = anchorEl ? anchorEl.getBoundingClientRect() : { left: innerWidth / 2 - 220, bottom: innerHeight / 3, top: innerHeight / 3 };
  UI.pop = { kind, x: r.left, y: r.bottom + 6, top: r.top, hi: 0, q: "", ...data };
  renderPop();
}
function closePop() { UI.pop = null; $("pop").innerHTML = ""; }
function placePop() {
  const el = $("pop").firstElementChild; if (!el || !UI.pop) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (el.classList.contains("search")) { el.style.left = Math.round((innerWidth - w) / 2) + "px"; el.style.top = "84px"; return; }
  let x = Math.min(UI.pop.x, innerWidth - w - 12), y = UI.pop.y;
  if (y + h > innerHeight - 12) y = Math.max(12, UI.pop.top - h - 6);
  el.style.left = Math.max(12, x) + "px"; el.style.top = y + "px";
}
function renderPop() {
  const p = UI.pop; if (!p) { $("pop").innerHTML = ""; return; }

      <button class="opt ${p.hi === 0 ? "hi" : ""}" data-act="popPick" data-v="need"><div class="menuopt">${ICON.need}<div><div class="t">New need</div><div class="s">A child need, typed right in the tree.</div></div></div></button>
      <button class="opt ${p.hi === 1 ? "hi" : ""}" data-act="popPick" data-v="cap"><div class="menuopt">${ICON.link}<div><div class="t">Link capability</div><div class="s">Search all ${IX.inv.capabilities.length} capabilities and link one here.</div></div></div></button></div></div>`;
  else if (p.kind === "linkCap") html = `<div class="pop search" style="width:520px"><div class="poph">Link a capability under “${esc(cut(needText(p.need), 40))}”</div>
      <div class="popb"><input type="search" id="popQ" placeholder="Search wording, card, routes…" value="${esc(p.q)}" autocomplete="off"></div><div class="res" id="popRes">${linkCapResults()}</div>
      <div class="popfoot" style="justify-content:space-between"><span class="small muted"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>Enter</kbd> link · <kbd>Esc</kbd> close</span></div></div>`;
  else if (p.kind === "linkNeed" || p.kind === "moveNeed" || p.kind === "unlinkPick") html = `<div class="pop search auto"><div class="poph">${p.kind === "unlinkPick" ? `Unlink “${esc(cut(capText(p.cap), 40))}” from…` : p.kind === "moveNeed" ? `Move “${esc(cut(needText(p.id), 34))}” under…` : `Link “${esc(cut(capText(p.cap), 40))}” under…`}</div>

      <div class="popfoot" style="justify-content:space-between"><span class="small muted"><kbd>↑</kbd><kbd>↓</kbd> choose · <kbd>Enter</kbd> pick · <kbd>Esc</kbd> close</span></div></div>`;
  else if (p.kind === "flag") {
    const what = p.tt === "need" ? needText(p.id) : p.tt === "capability" ? capText(p.id) : "Route " + routeLabel(IX.routes.get(p.id)) + ": " + IX.routes.get(p.id).summary;
    html = `<div class="pop"><div class="poph">Flag for a follow-up</div><div class="popsub">${esc(cut(what, 90))}</div>
      <div class="popb"><div class="seg" style="margin-bottom:10px"><button class="w ${p.fk === "wrong" ? "on" : ""}" data-act="flagKind" data-v="wrong">This is wrong</button><button class="d ${p.fk === "dig" ? "on" : ""}" data-act="flagKind" data-v="dig">Dig into this</button></div>
      <input type="text" id="popNote" placeholder="${p.fk === "wrong" ? "What looks wrong?" : "What should an agent dig into?"}" value="${esc(p.q)}"></div>
      <div class="popfoot"><span class="small muted" style="margin-right:auto"><kbd>Tab</kbd> switches kind · <kbd>Enter</kbd> saves</span><button class="btn sm" data-act="closePop">Cancel</button><button class="btn sm primary" data-act="flagSave">Add follow-up</button></div></div>`;
  }
  else if (p.kind === "reason") html = `<div class="pop"><div class="poph">${esc(p.title)}</div><div class="popsub">${esc(cut(p.sub, 100))}</div>

function linkCapResults() {
  const p = UI.pop; const q = p.q.trim();
  const list = (q ? matchCaps(q) : IX.inv.capabilities.filter(c => !Surface.tagsOf(S, c.id).length && !Surface.noOwner(S, c.id))).slice(0, 40);
  p.items = list.map(c => c.id);
  if (p.hi >= list.length) p.hi = Math.max(0, list.length - 1);
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const mark = (t) => { let h = esc(t); for (const w of words) h = h.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/&/g, "&amp;").replace(/</g, "&lt;") + ")", "ig"), "<mark>$1</mark>"); return h; };
  if (!list.length) return `<div class="small muted" style="padding:10px">Nothing matches “${esc(q)}”.</div>`;
  return (q ? "" : `<div class="small muted" style="padding:4px 10px 6px">Unplaced capabilities first. Type to search all of them.</div>`) + list.map((c, i) => {
    const here = Surface.tagsOf(S, c.id).some(t => t.need === p.need);
    const routes = IX.routesByCap.get(c.id) || [];
    const hitR = words.length ? routes.find(r => words.some(w => (r.summary || "").toLowerCase().includes(w)) && !words.every(w => c.text.toLowerCase().includes(w))) : null;
    const preview = hitR ? `Route ${routeLabel(hitR)}: ${routePlain(hitR) || hitR.summary}` : (routes[0] ? `${routes.length} route${routes.length > 1 ? "s" : ""}, e.g. ${routePlain(routes[0]) || routes[0].summary}` : c.possible);
    const under = Surface.tagsOf(S, c.id).map(t => cut(needText(t.need), 24));
    return `<button class="opt ${i === p.hi ? "hi" : ""}" data-act="popPick" data-i="${i}" ${here ? "disabled" : ""}>
      <div class="t">${mark(capText(c.id))}</div>
      ${gl(c.id) && gl(c.id).title ? `<div class="s" style="-webkit-line-clamp:1">${mark(c.text.replace(/`/g, ""))}</div>` : ""}
      <div class="s"><b>${esc((IX.cards.get(c.card) || {}).title || c.card)}</b> · ${here ? "already linked here" : under.length ? "also under " + esc(under.join(", ")) + " · " : ""}${mark(cut(preview.replace(/`/g, ""), 160))}</div></button>`;
  }).join("");
}
function needResults() {
  const p = UI.pop; const words = p.q.toLowerCase().split(/\s+/).filter(Boolean);
  const bad = p.kind === "moveNeed" ? new Set(Surface.subtree(S, p.id)) : new Set();
  const only = p.kind === "unlinkPick" ? new Set(placementsOf(p.cap)) : null;
  const flat = []; const walk = (n, d) => { if (!bad.has(n.id) && (n.statement || n.parent === null)) flat.push({ n, d }); Surface.children(S, n.id).forEach(k => walk(k, d + 1)); };
  walk(Surface.root(S), 0);
  const list = flat.filter(({ n }) => !only || only.has(n.id)).filter(({ n }) => !words.length || words.every(w => (n.statement + " " + (n.description || "")).toLowerCase().includes(w)));
  p.items = list.map(x => x.n.id);
  if (p.hi >= list.length) p.hi = Math.max(0, list.length - 1);
  if (flat.length <= 1 && p.kind === "linkNeed") return `<div class="small muted" style="padding:10px">No needs yet. Add needs on the Tree tab first.</div>`;
  if (!list.length) return `<div class="small muted" style="padding:10px">No need matches “${esc(p.q)}”.</div>`;
  return list.map(({ n, d }, i) => {
    const here = p.kind === "linkNeed" && Surface.tagsOf(S, p.cap).some(t => t.need === n.id);
    return `<button class="opt ${i === p.hi ? "hi" : ""}" data-act="popPick" data-i="${i}" ${here ? "disabled" : ""} style="padding-left:${10 + (words.length ? 0 : d * 14)}px">
      <div class="t"><span class="chip" style="padding:0;width:8px;height:8px;background:${colorOfNeed(n.id)};margin-right:6px"></span>${esc(n.statement || "The founding principle")}</div>
      ${words.length && n.parent ? `<div class="s">${esc(needPath(n.id).slice(1, -1).map(x => cut(needText(x), 24)).join(" › "))}</div>` : here ? `<div class="s">already linked here</div>` : ""}</button>`;
  }).join("");
}
function refreshPopResults() {
  const p = UI.pop; const res = $("popRes"); if (!res) return;
  res.innerHTML = p.kind === "linkCap" ? linkCapResults() : needResults();

function popPick(i) {
  const p = UI.pop; if (!p) return;
  if (p.kind === "addMenu") { const v = i === 0 ? "need" : "cap"; closePop(); if (v === "need") startAdd(p.need); else openPop("linkCap", p.anchor, { need: p.need, anchor: p.anchor }); return; }
  const id = (p.items || [])[i]; if (!id) return;
  if (p.kind === "linkCap") {
    if (Surface.tagsOf(S, id).some(t => t.need === p.need)) return;
    closePop(); setOpen("n|" + p.need, true); revealNeed(p.need); UI.flashKey = `c|${p.need}|${id}`;
    dispatch({ type: "tag", capability: id, need: p.need });
  } else if (p.kind === "linkNeed") {
    closePop();
    if (UI.tab === "tree") { setOpen("n|" + id, true); revealNeed(id); UI.flashKey = `c|${id}|${p.cap}`; }
    dispatch({ type: "tag", capability: p.cap, need: id });
  } else if (p.kind === "unlinkPick") {
    const anchor = document.querySelector('[data-act="unlinkAny"]'); closePop(); unlinkPop(anchor, p.cap, id);
  } else if (p.kind === "moveNeed") { closePop(); revealNeed(id); setOpen("n|" + id, true); UI.flashKey = "n|" + p.id; dispatch({ type: "moveNeed", id: p.id, parent: id }); }
}
function startAdd(needId) { UI.tab = "tree"; LS.set("tab", "tree"); UI.adding = needId; revealNeed(needId); setOpen("n|" + needId, true); UI.focus = "newNeed"; render(); }

function reasonPop(anchor, o) { openPop("reason", anchor, o); }
function unlinkPop(anchor, cap, need) { reasonPop(anchor, { title: `Unlink from “${cut(needText(need), 40)}”`, sub: capText(cap), ph: "Why it does not serve this need", ok: "Unlink", danger: true, optional: true, run: (t) => ({ type: "untag", capability: cap, need, reason: t }) }); }

/* ================= Events ================= */
function switchTab(v) { UI.tab = v; LS.set("tab", v); closePop(); render(); $("main").scrollTop = 0; }

document.addEventListener("click", async (e) => {
  if (UI.pop && !e.target.closest(".pop") && !e.target.closest("[data-act=addMenu],[data-act=flag],[data-act=linkNeed],[data-act=linkCap],[data-act=noOwner],[data-act=strike],[data-act=unlink],[data-act=unlinkAny],[data-act=moveNeed]")) closePop();
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.disabled) return;
  const act = el.dataset.act, d = el.dataset;
  if (el.tagName === "A") e.preventDefault();
  if (RO() && EDIT_ACTS.includes(act)) return;   // the agent's view has no edit path, keyboard-triggered clicks included
  switch (act) {
    case "view": if (e.detail === 0) setView(d.v); break;   // keyboard; the mouse is handled on mousedown below
    case "tab": switchTab(d.v); break;
    case "undo": undo(); break;
    case "dismissWarn": if (RO()) AGENT.warnings = []; else LOAD_WARNINGS = []; render(); break;
    case "backup": UI.modal = "open"; renderModal(); break;
    case "closeModal": UI.modal = null; renderModal(); break;
    case "modalBg": if (e.target === el) { UI.modal = null; renderModal(); } break;
    /* tree */
    case "toggle": e.stopPropagation(); setOpen(d.key, !isOpen(d.key)); render(); break;
    case "expandAll": S.needs.forEach(n => setOpen("n|" + n.id, true)); S.tags.forEach(t => setOpen(`c|${t.need}|${t.capability}`, true)); render(); break;
    case "collapseAll": { UI.open = new Set(["n|" + Surface.root(S).id]); if (!RO()) LS.set("open", [...UI.open]); render(); break; }
    case "selNeed": {
      if (e.target.closest("input")) break;
      const k = "n|" + d.id, was = selIs("need", d.id);
      if (was && isOpen(k)) setOpen(k, false); else setOpen(k, true);
      openPanel({ type: "need", id: d.id }); render(); break; }
    case "selCap": {
      openPanel({ type: "cap", id: d.id, need: d.need }); render(); break; }
    case "selRoute": e.stopPropagation(); openPanel({ type: "route", id: d.id, need: d.need }); render(); break;
    case "alsoUnder": e.stopPropagation(); jumpToCap(d.cap, d.need); break;
    case "startAdd": startAdd(d.id); break;
    case "addMenu": e.stopPropagation(); openPop("addMenu", el, { need: d.id, anchor: el }); break;
    case "linkCap": openPop("linkCap", el, { need: d.id, anchor: el }); break;
    case "linkNeed": e.stopPropagation(); openPop("linkNeed", el, { cap: d.cap }); break;
    case "moveNeed": openPop("moveNeed", el, { id: d.id }); break;
    case "flag": e.stopPropagation(); openPop("flag", el, { tt: d.tt, id: d.id, fk: "dig" }); break;
    case "flagKind": UI.pop.fk = d.v; UI.pop.q = $("popNote").value; renderPop(); break;
    case "flagSave": { const p = UI.pop; const note = $("popNote").value; closePop(); dispatch({ type: "addFollowup", target_type: p.tt, target: p.id, kind: p.fk, note }); break; }

    case "unlinkAny": e.stopPropagation(); { const ns = placementsOf(d.cap); if (ns.length === 1) unlinkPop(el, d.cap, ns[0]); else openPop("unlinkPick", el, { cap: d.cap }); } break;
    case "openFullPage": openFullPage(d.id); break;
    case "railPick": selectCap(d.id); UI._railReveal = false; renderMain(); break;
    case "railFilter": UI.rail.f = d.v; UI._railReveal = true; renderMain(); break;

    case "strike": e.stopPropagation(); { const r = IX.routes.get(d.r); reasonPop(el, { title: `Strike route ${routeLabel(r)} for every need`, sub: r.summary, ph: "One line: why it is out", ok: "Strike it", danger: true, run: (t) => ({ type: "strike", route: d.r, reason: t }) }); } break;
    case "reasonSave": { const p = UI.pop; const t = $("popNote").value.trim(); if (!p.optional && !t) { $("popNote").focus(); toast("Give a one-line reason.", "err"); break; } const a = p.run(t); closePop(); dispatch(a); if (p.after) p.after(); break; }

    case "setOpen": dispatch({ type: "setOpen", capability: d.cap || UI.sel.id, candidates: [...document.querySelectorAll('input[name="candR"]:checked')].map(x => x.value), known: $("openKnown").value.trim(), reopen: $("openReopen").value }) && (UI.decMode = null, render()); break;
    case "clearDec": UI.decMode = null; dispatch({ type: "clearDecision", capability: d.cap || UI.sel.id }); break;
    case "rnState": { const dr = UI.rnDraft[d.key]; dr.state = d.v; const inp = document.querySelector(`[data-rnkey="${CSS.escape(d.key)}"]`); if (inp) dr.text = inp.value; renderPanel(); const f = document.querySelector(`[data-rnkey="${CSS.escape(d.key)}"]`); if (f) f.focus(); break; }
    case "rnSave": { const key = `${d.r}|${d.need}`, dr = UI.rnDraft[key]; if (dispatch({ type: "setRouteNeed", route: d.r, need: d.need, state: dr.state, reason: dr.state === "open" ? "" : dr.text, reopen: dr.state === "open" ? dr.text : "" })) delete UI.rnDraft[key]; break; }
    case "rnClear": delete UI.rnDraft[`${d.r}|${d.need}`]; dispatch({ type: "clearRouteNeed", route: d.r, need: d.need }); break;
    /* unplaced */
    /* browse */
    /* follow-ups */
    case "fuFilter": UI.fuFilter = d.v; UI.fuIdx = 0; renderMain(); break;
    case "fuOpen": { if (e.target.closest("button")) break; UI.fuIdx = +d.i; const f = fuList()[+d.i]; if (f) jumpTo(f.target_type, f.target); break; }
    case "fuToggle": e.stopPropagation(); { const f = S.followups.find(x => x.id === d.id); dispatch({ type: "setFollowup", id: d.id, status: f.status === "done" ? "open" : "done" }, true); } break;
    case "fuDelete": e.stopPropagation(); dispatch({ type: "deleteFollowup", id: d.id }); break;
    /* backup */
    case "download": {
      const url = URL.createObjectURL(new Blob([stateText()], { type: "application/json" }));
      const a = document.createElement("a"); a.href = url; a.download = "working-surface.json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); break; }
    case "copy": try { await navigator.clipboard.writeText(stateText()); toast("Copied."); } catch (x) { toast("The browser blocked the clipboard; use Download instead.", "warn"); } break;
    case "checkImport": case "askImport": {
      UI.importText = $("importText").value; let obj;
      try { obj = JSON.parse(UI.importText); } catch (x) { UI.importMsg = { errors: ["Not valid JSON: " + x.message], warnings: [] }; UI.modal = "open"; renderModal(); break; }
      const r = Surface.importObject(IX, obj); UI.importMsg = { errors: r.errors, warnings: r.warnings };
      UI.modal = act === "askImport" && !r.errors.length ? "confirm" : "open"; renderModal(); break; }
    case "cancelImport": UI.modal = "open"; renderModal(); break;
    case "doImport": {
      let obj; try { obj = JSON.parse(UI.importText); } catch (x) { break; }
      const r = Surface.importObject(IX, obj); if (r.errors.length) { UI.importMsg = r; UI.modal = "open"; renderModal(); break; }
      if (S) UNDO.push(S);
      S = r.state; UI.sel = null; UI.back = []; UI.modal = null; UI.importMsg = null; LOAD_WARNINGS = [];
      renderModal(); render(); await saveNow(); toast(`Imported ${plural(r.state.needs.length, "need")} and ${plural(r.state.tags.length, "link")}.`, "", true); break; }
  }
});

/* The view toggle acts on mousedown: committing a half-typed field re-renders the header, which would
   swallow the click. preventDefault keeps focus, and setView blurs (so commits) the field itself. */
document.addEventListener("mousedown", (e) => {
  const el = e.target.closest && e.target.closest("[data-act=view]"); if (!el || e.button !== 0) return;
  e.preventDefault(); setView(el.dataset.v);
});

document.addEventListener("dblclick", (e) => {
  if (RO()) return;
  const el = e.target.closest("[data-dbl=rename]"); if (!el) return;
  UI.renaming = el.dataset.id; renderMain(); const f = $("rename-" + el.dataset.id); if (f) { f.focus(); f.select(); }
});

function commitRename(inp, save) {
  const id = inp.dataset.rename; const v = inp.value.trim(); const n = Surface.need(S, id);
  UI.renaming = null;
  if (save && n && v && v !== n.statement) dispatch({ type: "renameNeed", id, statement: v }, true);
  else render();
}

document.addEventListener("keydown", (e) => {
  const t = e.target;
  /* inline inputs */
  if (t.id === "newNeed") {
    if (e.key === "Enter") { e.preventDefault(); const v = t.value.trim(); if (!v) { UI.adding = null; render(); return; } UI.focus = "newNeed"; dispatch({ type: "addNeed", parent: t.dataset.parent, statement: v }, true); }
    else if (e.key === "Escape") { UI.adding = null; render(); }
    return;
  }
  if (t.dataset && t.dataset.rename) {
    if (e.key === "Enter") { e.preventDefault(); commitRename(t, true); }
    else if (e.key === "Escape") { commitRename(t, false); }
    return;
  }
  /* popovers */
  if (UI.pop) {
    const p = UI.pop;
    if (e.key === "Escape") { e.preventDefault(); closePop(); return; }
    if (p.kind === "addMenu") {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); p.hi = 1 - p.hi; renderPop(); }
      else if (e.key === "Enter") { e.preventDefault(); popPick(p.hi); }
      else if (e.key.toLowerCase() === "n") { e.preventDefault(); popPick(0); }
      else if (e.key.toLowerCase() === "l") { e.preventDefault(); popPick(1); }
      return;
    }
    if (p.kind === "linkCap" || p.kind === "linkNeed" || p.kind === "moveNeed" || p.kind === "unlinkPick") {
      const n = (p.items || []).length;
      if (e.key === "ArrowDown") { e.preventDefault(); p.hi = Math.min(n - 1, p.hi + 1); refreshPopResults(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); p.hi = Math.max(0, p.hi - 1); refreshPopResults(); }
      else if (e.key === "Enter") { e.preventDefault(); popPick(p.hi); }
      return;
    }
    if (p.kind === "flag") {
      if (e.key === "Tab") { e.preventDefault(); p.fk = p.fk === "dig" ? "wrong" : "dig"; p.q = $("popNote").value; renderPop(); }
      else if (e.key === "Enter") { e.preventDefault(); document.querySelector("[data-act=flagSave]").click(); }
      return;
    }
    if (p.kind === "reason" && e.key === "Enter") { e.preventDefault(); document.querySelector("[data-act=reasonSave]").click(); }
    return;
  }
  if (UI.modal) { if (e.key === "Escape") { UI.modal = null; renderModal(); } return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
  if (typing) { if (e.key === "Escape") t.blur(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape" && UI.sel) { UI.sel = null; UI.back = []; render(); return; }
  const k = e.key.toLowerCase();
  if (UI.tab === "caps") {
    if (k === "j") stepCap(1);
    else if (k === "k") stepCap(-1);
    else if (k === "l" && $("uLink") && !$("uLink").disabled) { e.preventDefault(); $("uLink").click(); }
    else if (k === "n" && $("uNo")) { e.preventDefault(); $("uNo").click(); }
    else if (k === "f" && $("uFlag")) { e.preventDefault(); $("uFlag").click(); }
  } else if (UI.tab === "followups") {
    const list = fuList();
    if (k === "j") { UI.fuIdx = Math.min(list.length - 1, UI.fuIdx + 1); renderMain(); }
    else if (k === "k") { UI.fuIdx = Math.max(0, UI.fuIdx - 1); renderMain(); }
    else if (e.key === "Enter" && list[UI.fuIdx]) { const f = list[UI.fuIdx]; jumpTo(f.target_type, f.target); }
    else if (k === "d" && list[UI.fuIdx]) { const f = list[UI.fuIdx]; dispatch({ type: "setFollowup", id: f.id, status: f.status === "done" ? "open" : "done" }, true); }
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "popQ" && UI.pop) { UI.pop.q = t.value; UI.pop.hi = 0; refreshPopResults(); }
  else if (t.id === "railQ") { UI.rail.q = t.value; const pos = t.selectionStart; renderMain(); const f = $("railQ"); f.focus(); f.setSelectionRange(pos, pos); }
  else if (t.dataset.rnkey) { UI.rnDraft[t.dataset.rnkey].text = t.value; }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "needDesc" && UI.sel) { const n = Surface.need(S, UI.sel.id); if (n && (n.description || "") !== t.value.trim()) dispatch({ type: "setNeedDescription", id: n.id, description: t.value }, true); }
  else if (t.id === "capNote" && UI.sel) { if (Surface.noteOf(S, UI.sel.id) !== t.value.trim()) dispatch({ type: "setNote", target: UI.sel.id, text: t.value }, true); }
  else if (t.id === "importFile" && t.files[0]) { const fr = new FileReader(); fr.onload = () => { UI.importText = String(fr.result); UI.importMsg = null; UI.modal = "open"; renderModal(); }; fr.readAsText(t.files[0]); }
});
document.addEventListener("focusout", (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.rename && document.contains(t)) { const n = Surface.need(S, t.dataset.rename); if (n && n.parent === null && !n.statement && !t.value.trim()) return; commitRename(t, true); }
  if (t.id === "newNeed" && !t.value.trim()) setTimeout(() => { if (UI.adding && document.activeElement && document.activeElement.id !== "newNeed") { UI.adding = null; render(); } }, 150);
});
document.addEventListener("toggle", (e) => { if (e.target.matches && e.target.matches("details[data-framing]")) UI.framingOpen = e.target.open; }, true);

/* tooltips */
let tipTimer = null;
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]"); const tipEl = $("tip");
  clearTimeout(tipTimer);
  if (!el) { tipEl.classList.remove("on"); return; }
  tipTimer = setTimeout(() => {
    tipEl.textContent = el.dataset.tip; const r = el.getBoundingClientRect();
    tipEl.style.left = "0px"; tipEl.style.top = "0px"; tipEl.classList.add("on");
    const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8), y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = r.top - h - 8;
    tipEl.style.left = x + "px"; tipEl.style.top = y + "px";
  }, 350);
});
document.addEventListener("scroll", (e) => { $("tip").classList.remove("on"); if (UI.pop && !(e.target.closest && e.target.closest(".pop"))) closePop(); }, true);

render();
load();
</script>
